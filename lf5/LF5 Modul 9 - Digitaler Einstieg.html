<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF5 Modul 9 – Digitaler Einstieg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* LF5 Digitale Einstiege – gemeinsames Layout. Handy zuerst, auf dem Beamer groß genug. */
:root{
  --bg:#f3efe6; --paper:#ffffff; --paper2:#f8f5ee; --ink:#1d1b17; --muted:#5f5a50; --line:#dcd5c6;
  --tag:#ffd23f; --berry:#c8251d; --berry-soft:#fbe4e1; --leaf:#2f7d3a; --leaf-soft:#e3f2e4;
  --ok:#1e6e3c; --ok-soft:#e1f1e5; --no:#a3271f; --no-soft:#f8e2df; --blue:#1f5fa8; --blue-soft:#e2ecf8;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16150f; --paper:#221f19; --paper2:#1b1a15; --ink:#f1ede2; --muted:#b4ad9d; --line:#3d392f;
  --berry:#ff7468; --berry-soft:#3a1f1c; --leaf:#7fd18a; --leaf-soft:#1d3322;
  --ok:#7dd69a; --ok-soft:#1d3324; --no:#ff8a7f; --no-soft:#3a1f1c; --blue:#8bb8f0; --blue-soft:#1b2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16150f; --paper:#221f19; --paper2:#1b1a15; --ink:#f1ede2; --muted:#b4ad9d; --line:#3d392f;
  --berry:#ff7468; --berry-soft:#3a1f1c; --leaf:#7fd18a; --leaf-soft:#1d3322;
  --ok:#7dd69a; --ok-soft:#1d3324; --no:#ff8a7f; --no-soft:#3a1f1c; --blue:#8bb8f0; --blue-soft:#1b2a3d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px}
.badge{font-family:var(--display);font-weight:800;background:var(--tag);color:#1d1b17;padding:3px 10px;border-radius:4px;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.top .tt{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);flex:1;min-width:150px}
.iconbtn{background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--berry);width:0;transition:width .4s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,52px);line-height:1.02;margin:6px 0 10px;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,32px);line-height:1.1;margin:2px 0 10px}
.kicker{font-family:var(--display);font-weight:800;color:var(--berry);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.auftrag{background:var(--paper2);border-left:5px solid var(--tag);padding:10px 12px;border-radius:6px;margin:8px 0 14px}
.muted{color:var(--muted)}
.small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 18px;cursor:pointer;min-height:50px;text-align:center}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.big{font-size:20px;padding:14px 24px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.opts.three{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:54px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--no-soft);border-color:var(--no)}
.opt:disabled{cursor:default}
.opt.g{border-left:12px solid #2e9a48}.opt.y{border-left:12px solid #e8b400}.opt.r{border-left:12px solid #d33a2c}
.bigcard{background:var(--paper2);border:2px dashed var(--line);border-radius:14px;padding:18px;font-size:clamp(19px,3vw,25px);font-weight:700;min-height:110px;display:flex;align-items:center;gap:14px}
.bigcard .ic{font-size:44px;line-height:1}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;display:none}
.fb.show{display:block;animation:pop .25s ease}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--no-soft);border:1px solid var(--no)}
.fb b.h{display:block;font-family:var(--display);font-size:19px;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.count{font-family:var(--display);font-weight:800;color:var(--muted);font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.story{display:grid;gap:14px}
.story .pic{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper2)}
.story .pic svg{display:block;width:100%;height:auto}
.speech{background:var(--paper2);border-radius:14px;padding:12px 14px;position:relative;border:1px solid var(--line)}
.speech b{color:var(--berry)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* Reihenfolge */
.orderlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px;counter-reset:o}
.orderlist li{background:var(--ok-soft);border:2px solid var(--ok);border-radius:12px;padding:10px 12px;font-weight:700;counter-increment:o}
.orderlist li::before{content:counter(o) ". ";font-family:var(--display);color:var(--ok)}
.orderlist li.empty{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:400}
.orderlist li.empty::before{color:var(--muted)}
/* Abstimmung */
.scale{margin:18px 0 6px}
.scale input{width:100%;accent-color:var(--berry);height:36px}
.scale .lab{display:flex;justify-content:space-between;font-weight:700;gap:10px;font-size:16px}
.vgl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
/* Tabellen */
table.daten{border-collapse:collapse;width:100%;margin:10px 0;font-size:17px}
table.daten td,table.daten th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.daten td.n,table.daten th.n{text-align:right;font-variant-numeric:tabular-nums}
.formel{font-family:var(--display);font-weight:800;background:var(--tag);color:#1d1b17;padding:8px 12px;border-radius:8px;display:inline-block;margin:6px 0}
input.zahl{font:inherit;font-size:24px;font-weight:700;width:180px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
/* Shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.item{font:inherit;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:grid;gap:4px}
.item .p{font-family:var(--display);font-weight:900;font-size:22px}
.item.on{border-color:var(--berry);background:var(--berry-soft)}
.item:disabled{opacity:.4;cursor:not-allowed}
.budget{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
/* Hotspots */
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper2)}
.scene svg{display:block;width:100%;height:auto}
.scene .hs{cursor:pointer}
.scene .hs .ring{fill:var(--tag);stroke:#1d1b17;stroke-width:2;animation:pulse 1.6s infinite;transform-box:fill-box;transform-origin:center}
.scene .hs.found .ring{fill:#2e9a48;animation:none}
.scene .hs text.q{font:900 24px var(--display);fill:#1d1b17;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.18)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--paper);color:var(--ink);border-radius:16px;max-width:620px;width:100%;padding:18px;max-height:88vh;overflow:auto}
@media (min-width:700px){.modal{align-items:center}}
/* Chat */
.chat{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;max-height:52vh;overflow:auto}
.msg{max-width:85%;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;animation:pop .25s}
.msg .who{font-size:13px;font-weight:700;color:var(--berry)}
.msg.me{justify-self:end;background:var(--leaf-soft);border-radius:14px 14px 4px 14px}
/* Tour */
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--leaf-soft)}
.map svg{display:block;width:100%;height:auto}
.map .stop{cursor:pointer}
.map .stop circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.map .stop.sel circle{fill:var(--tag)}
.map text{font:700 15px var(--body);fill:var(--ink)}
/* Ende */
.stars{font-size:46px;letter-spacing:6px;color:#e8b400}
.lern{display:grid;gap:8px;margin:10px 0;padding:0;list-style:none}
.lern li{background:var(--paper2);border-radius:10px;padding:10px 12px;border-left:5px solid var(--leaf)}
.profi{border:2px solid var(--blue);background:var(--blue-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.profi b.h{font-family:var(--display);color:var(--blue)}
.leit{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);background:var(--tag);color:#1d1b17;border-radius:12px;padding:14px 16px;margin:12px 0}
.lehrer h3{font-family:var(--display);margin:14px 0 4px}
.lehrer ol,.lehrer ul{margin:4px 0;padding-left:22px}
.count321{font-family:var(--display);font-weight:900;font-size:120px;text-align:center;color:var(--berry);line-height:1}
.hint{background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<script>
(function(){
const ring = (x, y) => '<circle class="ring" cx="' + x + '" cy="' + y + '" r="22"/><text class="q" x="' + x + '" y="' + (y + 8) + '" text-anchor="middle">?</text>';

'</svg>';
const A = ["Schutz der Waren", "Informationen über die Ware", "Erleichterung des Gebrauchs", "Serviceaufgaben", "Werbemittel"];
const q = (t, r) => ({t: t, o: A, r: r});
window.MODUL = {
nr: 9, kurz: "Verpackung und Verpackungsgesetz", dauer: 12,
titel: "Was kann dieses Glas?",
teaser: "Ein Erlebnisdorf wie Karls verkauft eigene Marmeladen, Sirupe und Geschenksets. Eine Verpackung sieht unscheinbar aus – dabei arbeitet sie für fünf. Untersucht ein Geschenkset genau: Welche Aufgabe übernimmt welches Teil? Und wo landet die Verpackung am Ende?",

steps: [
{type: "hotspot", kicker: "Lupe auf!", titel: "Das Geschenkset unter der Lupe", min: 6, svg: svg,

  {id: "deckel", titel: "Der Deckel", text: "Der fest verschlossene Deckel schützt die Konfitüre vor Luft, Schmutz und Austrocknen. Das Stoffhäubchen darüber sieht schön aus – es macht den Deckel zusätzlich zum Werbemittel.", frage: q("Welche Aufgabe erfüllt der fest verschlossene Deckel vor allem?", 0)},

  {id: "etikett", titel: "Das Vorderetikett", text: "Bild, Farbe und Schrift geben der Ware „ein Gesicht“. In der Selbstbedienung übernimmt die Verpackung die Aufgabe des Verkäufers – sie wird zum Werbemittel.", frage: q("Welche Aufgabe erfüllt das bunte Vorderetikett vor allem?", 4)},
  {id: "karton", titel: "Der Geschenkkarton", text: "Der Karton ist eine <b>Umverpackung</b>: eine zusätzliche Verpackung um die Verkaufsverpackungen. Sie macht ein Geschenkset daraus, dient der Werbung und erschwert Diebstahl.",
   frage: {t: "Welche Verpackungsart ist der Geschenkkarton?", o: ["Umverpackung", "Transportverpackung", "Verkaufsverpackung"], r: 0}},
  {id: "palette", titel: "Die Palette mit Kartons", text: "Kartons und Palette schützen die Gläser auf dem Weg vom Hersteller zum Laden. Das ist die <b>Transportverpackung</b>. Die Palette ist außerdem eine Mehrwegverpackung.",
   frage: {t: "Welche Verpackungsart sind Kartons und Palette?", o: ["Transportverpackung", "Umverpackung", "Verkaufsverpackung"], r: 0}},
  {id: "tuete", titel: "Die Papiertüte", text: "Mit der Tüte trägt der Kunde seinen Einkauf nach Hause. Sie ist eine <b>Verkaufsverpackung</b> – und mit Logo auch ein Werbeträger.",
   frage: {t: "Welche Verpackungsart ist die Tragetüte?", o: ["Verkaufsverpackung", "Umverpackung", "Transportverpackung"], r: 0}}
 ]},
{type: "quiz", kicker: "Wer zahlt den Müll?", titel: "Das Verpackungsgesetz",
 auftrag: "Jedes Glas, jede Tüte landet irgendwann im Müll. Das Verpackungsgesetz regelt, wer sich darum kümmert.",

ende: {

},
lehrer: {
 dauer: "12 Minuten", form: "Beamer: Schüler tippen nacheinander, die Klasse beantwortet per Zuruf. Gut kombinierbar mit echten Verpackungen auf dem Tisch.",
 ablauf: ["Geschenkset untersuchen, mindestens sechs Teile (7 Min.).", "Drei Fragen zum Verpackungsgesetz (3 Min.).", "Leitfrage (2 Min.)."],
 ueberleitung: "„Ein Glas, fünf Aufgaben, drei Arten und ein Gesetz. Heute ordnen wir das sauber – und auf der Exkursion zu Karls sammelt das Verpackungsteam die Beispiele dazu.“",
 bezug: "Digitale Fassung von Variante B (Was kann diese Verpackung?) aus dem Einstiegsmaterial Modul 9; die fünf Aufgaben folgen der Tabelle in den Aufgaben/Lösungen. Passt zur Verpackungs-Rallye."
}
};
})();

</script>
<script>
/* LF5 Digitale Einstiege – Engine. Erwartet window.MODUL = {nr, titel, kurz, dauer, steps:[...], ende:{...}, lehrer:{...}} */
(function(){
"use strict";
const M = window.MODUL;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (n, d) => Number(n).toLocaleString("de-DE", {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0});
const S = {i: -1, score: 0, max: 0, votes: {}, wrong: []};
let stage, prog;

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function shell(){
  document.title = "LF5 Modul " + M.nr + " – " + M.kurz;
  document.body.innerHTML =
    '<div class="wrap"><header class="top"><span class="badge">LF 5 · Modul ' + M.nr + '</span><span class="tt">' + M.kurz + '</span>' +
    '<button class="iconbtn" id="lk">Für die Lehrkraft</button><button class="iconbtn" id="neu" title="Von vorn">↺</button></header>' +
    '<div class="progress"><i id="prog"></i></div><main id="stage"></main></div>' +
    '<div class="modal" id="modal"><div class="box" id="mbox"></div></div>';
  stage = $("#stage"); prog = $("#prog");
  $("#lk").onclick = lehrer;
  $("#neu").onclick = () => { if (confirm("Den Einstieg von vorn beginnen?")) start(); };
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal" && !$("#modal").dataset.lock) closeModal(); });
}
function openModal(html, lock){ $("#mbox").innerHTML = html; const m = $("#modal"); m.classList.add("show"); if (lock) m.dataset.lock = 1; else delete m.dataset.lock; }
function closeModal(){ $("#modal").classList.remove("show"); }
window.__closeModal = closeModal;

function lehrer(){
  const L = M.lehrer;
  openModal('<div class="lehrer"><div class="kicker">Für die Lehrkraft</div><h2>' + M.titel + '</h2>' +
    '<p class="small muted">' + L.dauer + ' · ' + L.form + '</p>' +
    '<h3>So läuft es</h3><ol>' + L.ablauf.map(x => '<li>' + x + '</li>').join("") + '</ol>' +
    '<h3>Leitfrage für das Gespräch</h3><p>' + M.ende.leitfrage + '</p>' +
    '<h3>Überleitung</h3><p>' + L.ueberleitung + '</p>' +
    '<h3>Differenzierung nach oben</h3><p>' + M.ende.profi + '</p>' +
    (L.bezug ? '<h3>Passt zu</h3><p>' + L.bezug + '</p>' : '') +
    '<p class="note">Die Fälle mit Karls Erlebnis-Dorf sind für den Unterricht ausgedacht: Zahlen, Preise, Personen und Aktionen sind erfunden. Konrad Kalt und sein MEGAMARKT stammen aus dem Spiel „Countdown Hafenstraße“.</p>' +
    '<div class="next"><button class="btn" onclick="__closeModal()">Schließen</button></div></div>');
}

function setProg(){ prog.style.width = Math.round(100 * Math.max(0, S.i) / (M.steps.length + 1)) + "%"; }
function add(p, m){ S.score += p; S.max += m; }
function nextBtn(label){ return '<div class="next"><button class="btn big" id="weiter">' + (label || "Weiter →") + '</button></div>'; }
function bindNext(){ const b = $("#weiter"); if (b) b.onclick = go; }
function go(){ S.i++; setProg(); window.scrollTo({top: 0, behavior: "smooth"}); if (S.i >= M.steps.length) return ende(); const s = M.steps[S.i]; (T[s.type] || T.story)(s); }
function head(s){ return (s.kicker ? '<div class="kicker">' + s.kicker + '</div>' : '') + '<h2>' + s.titel + '</h2>' + (s.auftrag ? '<div class="auftrag">' + s.auftrag + '</div>' : ''); }

function start(){
  S.i = -1; S.score = 0; S.max = 0; S.votes = {}; S.wrong = [];
  setProg();
  stage.innerHTML = '<div class="card"><div class="kicker">Digitaler Einstieg · ca. ' + M.dauer + ' Minuten</div><h1>' + M.titel + '</h1>' +
    (M.bild ? '<div class="story"><div class="pic">' + M.bild + '</div></div>' : '') +
    '<p>' + M.teaser + '</p>' +
    '<div class="hint">Am Beamer: Die Klasse entscheidet gemeinsam (Handzeichen, Aufstehen, Zuruf), eine Person tippt. Am Handy: allein oder zu zweit durchspielen.</div>' +
    nextBtn("Los geht’s") + '</div>';
  bindNext();
}

const T = {};

T.story = s => {
  stage.innerHTML = '<div class="card">' + head(s) + '<div class="story">' + (s.bild ? '<div class="pic">' + s.bild + '</div>' : '') +
    (s.text || '') + '</div>' + (s.note ? '<p class="note">' + s.note + '</p>' : '') + nextBtn(s.weiter) + '</div>';
  bindNext();
};

/* Karten nacheinander in Körbe sortieren */
T.sort = s => {
  const cards = s.fest ? s.karten.slice() : shuffle(s.karten);
  let k = 0, ok = 0;
  const cls = s.buckets.length === 2 ? "two" : s.buckets.length === 3 ? "three" : "";
  function show(){
    const c = cards[k];
    stage.innerHTML = '<div class="card">' + head(s) + '<div class="count">Karte ' + (k + 1) + ' von ' + cards.length + ' · richtig: ' + ok + '</div>' +
      '<div class="bigcard" id="bc">' + (c.ic ? '<span class="ic">' + c.ic + '</span>' : '') + '<span>' + c.t + '</span></div>' +
      '<div class="opts ' + cls + '">' + s.buckets.map((b, i) => '<button class="opt ' + (b.cls || '') + '" data-i="' + i + '">' + b.label + '</button>').join("") + '</div>' +
      '<div class="fb" id="fb"></div><div class="next" id="nx" style="display:none"><button class="btn big" id="nk">' + (k + 1 < cards.length ? "Nächste Karte →" : "Weiter →") + '</button></div></div>';
    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
    $("#nk").onclick = () => { k++; if (k < cards.length) show(); else go(); };
  }
  function pick(i){
    const c = cards[k], right = s.buckets.findIndex(b => b.id === c.b), hit = i === right;
    stage.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === right) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
    if (hit) ok++; else S.wrong.push(c.t);
    add(hit ? 1 : 0, 1);
    const fb = $("#fb"); fb.className = "fb show " + (hit ? "ok" : "no");
    fb.innerHTML = '<b class="h">' + (hit ? "Richtig!" : "Nicht ganz – richtig ist: " + s.buckets[right].label) + '</b>' + (c.why || "");
    if (!hit) $("#bc").classList.add("shake");
    $("#nx").style.display = "flex";
  }
  show();
};

/* Fragen mit Auswahl, optional Countdown für die Klasse */
T.quiz = s => {
  const qs = s.fest ? s.fragen.slice() : shuffle(s.fragen);
  let k = 0, ok = 0;
  function show(){
    const q = qs[k];
    const order = q.fest || s.ampel ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i));
    const amp = ["g", "y", "r"];
    stage.innerHTML = '<div class="card">' + head(s) + '<div class="count">Fall ' + (k + 1) + ' von ' + qs.length + ' · richtig: ' + ok + '</div>' +
      (q.chat ? '<div class="chat" id="chat"></div>' : '<div class="bigcard" id="bc">' + (q.ic ? '<span class="ic">' + q.ic + '</span>' : '') + '<span>' + q.t + '</span></div>') +
      (q.chat ? '<p style="font-weight:700;margin:12px 0 0">' + q.t + '</p>' : '') +
      (s.countdown ? '<div class="row" style="margin-top:10px"><button class="btn alt" id="cd">3 · 2 · 1 – alle gleichzeitig!</button></div>' : '') +
      '<div class="opts' + (s.ampel ? ' three' : '') + '">' + order.map(i => '<button class="opt ' + (s.ampel ? amp[i] : '') + '" data-i="' + i + '">' + q.o[i] + '</button>').join("") + '</div>' +
      '<div class="fb" id="fb"></div><div class="next" id="nx" style="display:none"><button class="btn big" id="nk">' + (k + 1 < qs.length ? "Nächster Fall →" : "Weiter →") + '</button></div></div>';
    if (q.chat) renderChat(q.chat);
    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
    if (s.countdown) $("#cd").onclick = countdown;
    $("#nk").onclick = () => { k++; if (k < qs.length) show(); else go(); };
  }
  function pick(i){
    const q = qs[k], hit = i === q.r;
    stage.querySelectorAll(".opt").forEach(b => { const j = +b.dataset.i; b.disabled = true; if (j === q.r) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
    if (hit) ok++; else S.wrong.push(q.t);
    add(hit ? 1 : 0, 1);
    const fb = $("#fb"); fb.className = "fb show " + (hit ? "ok" : "no");
    fb.innerHTML = '<b class="h">' + (hit ? "Richtig!" : "Nicht ganz – richtig ist: " + q.o[q.r]) + '</b>' + (q.why || "") + (q.pruef ? '<div class="small" style="margin-top:6px"><b>Prüfungssprache:</b> ' + q.pruef + '</div>' : '');
    $("#nx").style.display = "flex";
  }
  show();
};
function renderChat(list){
  const box = $("#chat"); let n = 0;
  (function tick(){
    if (n >= list.length) return;
    const m = list[n++], d = document.createElement("div");
    d.className = "msg" + (m.me ? " me" : ""); d.innerHTML = '<div class="who">' + m.von + '</div>' + m.text;
    box.appendChild(d); box.scrollTop = box.scrollHeight;
    setTimeout(tick, 550);
  })();
}
function countdown(){
  openModal('<div class="count321" id="c3">3</div><p style="text-align:center">Alle zeigen gleichzeitig!</p>', true);
  let n = 3; const t = setInterval(() => { n--; if (n > 0) $("#c3").textContent = n; else { $("#c3").textContent = "Jetzt!"; clearInterval(t); setTimeout(closeModal, 800); } }, 800);
}

/* Reihenfolge antippen */
T.order = s => {
  const items = s.items, pool = shuffle(items.map((t, i) => ({t, i})));
  let n = 0, err = 0;
  function show(){
    stage.innerHTML = '<div class="card">' + head(s) + '<ol class="orderlist">' + items.map((t, i) => i < n ? '<li>' + t + '</li>' : '<li class="empty">…</li>').join("") + '</ol>' +
      '<div class="opts">' + pool.filter(p => p.i >= n).map(p => '<button class="opt" data-i="' + p.i + '">' + p.t + '</button>').join("") + '</div>' +
      '<div class="count" style="margin-top:8px">Fehlversuche: ' + err + '</div><div class="fb" id="fb"></div>' +
      (n >= items.length ? nextBtn() : '') + '</div>';
    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (+b.dataset.i === n) { n++; if (n >= items.length) { const p = Math.max(0, items.length - err); add(p, items.length); } show(); if (n >= items.length) done(); }
      else { err++; b.classList.add("shake", "no"); setTimeout(() => b.classList.remove("shake", "no"), 400); const c = stage.querySelector(".count"); c.textContent = "Fehlversuche: " + err; if (s.tipps && s.tipps[n]) { const fb = $("#fb"); fb.className = "fb show no"; fb.innerHTML = '<b class="h">Tipp</b>' + s.tipps[n]; } }
    });
  }
  function done(){ const fb = $("#fb"); fb.className = "fb show ok"; fb.innerHTML = '<b class="h">' + (err === 0 ? "Fehlerfrei!" : "Geschafft!") + '</b>' + (s.why || ""); bindNext(); }
  show();
};

/* Meinungslinie / Schätzung */
T.vote = s => {
  const prev = s.vergleich ? S.votes[s.vergleich] : null;
  stage.innerHTML = '<div class="card">' + head(s) + (s.text || '') +
    '<div class="hint">Am Beamer: Alle stellen sich auf eine gedachte Linie quer durch den Raum. Dann wird der Regler dorthin geschoben, wo die meisten stehen.</div>' +
    '<div class="scale"><input type="range" min="0" max="100" value="50" id="sl"><div class="lab"><span>' + s.links + '</span><span>' + s.rechts + '</span></div></div>' +
    '<div class="row"><button class="btn" id="fix">So sehen wir das</button></div><div class="fb" id="fb"></div><div id="nxw"></div></div>';
  $("#fix").onclick = () => {
    const v = +$("#sl").value; S.votes[s.id] = v; $("#sl").disabled = true; $("#fix").disabled = true;
    const side = v < 40 ? s.links : v > 60 ? s.rechts : "unentschieden";
    let h = '<b class="h">Festgehalten: ' + side + '</b>';
    if (prev != null) { const d = v - prev; h += '<div class="vgl"><span class="pill">vorher: ' + (prev < 40 ? s.links : prev > 60 ? s.rechts : "unentschieden") + '</span><span class="pill">jetzt: ' + side + '</span></div>' + (Math.abs(d) >= 15 ? '<p>Ihr habt eure Meinung geändert. Was hat den Ausschlag gegeben?</p>' : '<p>Ihr bleibt bei eurer Meinung. Woran liegt das?</p>'); }
    if (s.aufloesung) h += '<div style="margin-top:6px">' + s.aufloesung + '</div>';
    const fb = $("#fb"); fb.className = "fb show ok"; fb.innerHTML = h;
    $("#nxw").innerHTML = nextBtn(); bindNext();
  };
};

/* Rechnen */
T.calc = s => {
  let tries = 0, tipp = false;
  stage.innerHTML = '<div class="card">' + head(s) + (s.text || '') +
    '<div class="row"><button class="btn alt" id="ft">Formel zeigen</button></div><div id="fo"></div>' +
    '<div class="row" style="margin-top:12px"><input class="zahl" id="z" inputmode="decimal" placeholder="Ergebnis"><span style="font-weight:700">' + (s.einheit || '') + '</span><button class="btn" id="ck">Prüfen</button></div>' +
    '<div class="fb" id="fb"></div><div id="nxw"></div></div>';
  $("#ft").onclick = () => { tipp = true; $("#fo").innerHTML = '<div class="formel">' + s.formel + '</div>'; $("#ft").disabled = true; };
  $("#ck").onclick = () => {
    const v = parseFloat(($("#z").value || "").replace(/\./g, "").replace(",", "."));
    if (isNaN(v)) return;
    tries++;
    const hit = Math.abs(v - s.antwort) <= (s.tol || 0.5);
    const fb = $("#fb");
    if (hit || tries >= 2) {
      const p = hit ? (tries === 1 && !tipp ? 3 : tries === 1 ? 2 : 1) : 0; add(p, 3);
      fb.className = "fb show " + (hit ? "ok" : "no");
      fb.innerHTML = '<b class="h">' + (hit ? "Stimmt! " : "Leider nicht. ") + 'Ergebnis: ' + fmt(s.antwort, s.dez) + ' ' + (s.einheit || '') + '</b>' + s.weg + (s.deutung ? '<p style="margin:8px 0 0">' + s.deutung + '</p>' : '');
      $("#ck").disabled = true; $("#z").disabled = true; $("#nxw").innerHTML = nextBtn(); bindNext();
    } else {
      fb.className = "fb show no"; fb.innerHTML = '<b class="h">Noch nicht. Ein Versuch bleibt.</b>' + (s.fehler ? s.fehler(v) : 'Prüfe die Reihenfolge: erst mal 100, dann teilen.');
    }
  };
};

/* Werbe-Einkauf mit Budget */
T.shop = s => {
  const on = new Set();
  const best = (() => { let b = 0; const n = s.items.length; for (let m = 0; m < 1 << n; m++) { let c = 0, z = 0; for (let i = 0; i < n; i++) if (m >> i & 1) { c += s.items[i].preis; z += s.items[i].reich * s.items[i].ziel; } if (c <= s.budget && z > b) b = z; } return b; })();
  function sum(){ let c = 0, r = 0, z = 0; on.forEach(i => { const it = s.items[i]; c += it.preis; r += it.reich; z += it.reich * it.ziel; }); return {c, r, z}; }
  function show(){
    const x = sum(), rest = s.budget - x.c;
    stage.innerHTML = '<div class="card">' + head(s) +
      '<div class="budget"><div class="row" style="justify-content:space-between"><b>Ausgegeben: ' + fmt(x.c) + ' €</b><b>Rest: ' + fmt(rest) + ' €</b></div><div class="bar"><i style="width:' + Math.min(100, 100 * x.c / s.budget) + '%"></i></div></div>' +
      '<div class="shop">' + s.items.map((it, i) => '<button class="item' + (on.has(i) ? ' on' : '') + '" data-i="' + i + '"' + (!on.has(i) && it.preis > rest ? ' disabled' : '') + '><span style="font-size:30px">' + it.ic + '</span><b>' + it.name + '</b><span class="p">' + fmt(it.preis) + ' €</span><span class="small muted">' + it.info + '</span></button>').join("") + '</div>' +
      '<div class="next"><button class="btn big" id="kauf"' + (on.size ? '' : ' disabled') + '>Einkauf abschließen</button></div></div>';
    stage.querySelectorAll(".item").forEach(b => b.onclick = () => { const i = +b.dataset.i; on.has(i) ? on.delete(i) : on.add(i); show(); });
    $("#kauf").onclick = result;
  }
  function result(){
    const x = sum(), q = best ? x.z / best : 0, p = Math.round(q * 5);
    add(p, 5);
    const streu = x.r ? Math.round(100 * (1 - x.z / x.r)) : 0;
    stage.innerHTML = '<div class="card"><div class="kicker">Auswertung</div><h2>Euer Werbe-Einkauf</h2>' +
      '<table class="daten"><tr><th>Werbemaßnahme</th><th class="n">Kosten</th><th class="n">erreicht</th><th class="n">davon Zielgruppe</th></tr>' +
      [...on].map(i => { const it = s.items[i]; return '<tr><td>' + it.ic + ' ' + it.name + '</td><td class="n">' + fmt(it.preis) + ' €</td><td class="n">' + fmt(it.reich) + '</td><td class="n">' + fmt(it.reich * it.ziel) + '</td></tr>'; }).join("") +
      '<tr><th>Summe</th><th class="n">' + fmt(x.c) + ' €</th><th class="n">' + fmt(x.r) + '</th><th class="n">' + fmt(x.z) + '</th></tr></table>' +
      '<div class="fb show ' + (q >= .8 ? 'ok' : 'no') + '"><b class="h">Ihr erreicht ' + fmt(x.z) + ' Menschen aus der Zielgruppe – ' + Math.round(q * 100) + ' % vom bestmöglichen Einkauf.</b>' +
      streu + ' % eurer Kontakte sind Menschen, die gar nicht zur Zielgruppe gehören. Dafür gibt es ein Fachwort: <b>Streuverlust</b>.' + (s.nachher || '') + '</div>' +
      nextBtn() + '</div>';
    bindNext();
  }
  show();
};

/* Wimmelbild mit Fundstellen */
T.hotspot = s => {
  const found = new Set();
  stage.innerHTML = '<div class="card">' + head(s) + '<div class="count" id="hc"></div><div class="scene" id="sc">' + s.svg + '</div><div id="nxw"></div></div>';
  function upd(){ $("#hc").textContent = "Gefunden: " + found.size + " von " + s.spots.length + (found.size < s.min ? " · mindestens " + s.min + " zum Weitergehen" : ""); if (found.size >= s.min && !$("#weiter")) { $("#nxw").innerHTML = nextBtn(found.size < s.spots.length ? "Weiter (oder weitersuchen)" : "Weiter →"); bindNext(); } }
  s.spots.forEach(sp => {
    const g = $('[data-hs="' + sp.id + '"]', $("#sc")); if (!g) return;
    g.classList.add("hs");
    g.addEventListener("click", () => {
      if (found.has(sp.id)) { openModal('<div class="kicker">Schon gefunden</div><h2>' + sp.titel + '</h2><p>' + sp.text + '</p><div class="next"><button class="btn" onclick="__closeModal()">Zurück zum Bild</button></div>'); return; }
      const q = sp.frage;
      if (!q) { found.add(sp.id); g.classList.add("found"); openModal('<h2>' + sp.titel + '</h2><p>' + sp.text + '</p><div class="next"><button class="btn" onclick="__closeModal()">Weitersuchen</button></div>'); upd(); return; }
      const ord = shuffle(q.o.map((_, i) => i));
      openModal('<div class="kicker">Fundstück</div><h2>' + sp.titel + '</h2><p>' + q.t + '</p><div class="opts">' + ord.map(i => '<button class="opt" data-i="' + i + '">' + q.o[i] + '</button>').join("") + '</div><div class="fb" id="hfb"></div><div class="next" id="hnx" style="display:none"><button class="btn" onclick="__closeModal()">Weitersuchen</button></div>', true);
      document.querySelectorAll("#mbox .opt").forEach(b => b.onclick = () => {
        const i = +b.dataset.i, hit = i === q.r;
        document.querySelectorAll("#mbox .opt").forEach(x => { const j = +x.dataset.i; x.disabled = true; if (j === q.r) x.classList.add("ok"); else if (j === i) x.classList.add("no"); });
        add(hit ? 1 : 0, 1); if (!hit) S.wrong.push(sp.titel);
        const fb = $("#hfb"); fb.className = "fb show " + (hit ? "ok" : "no"); fb.innerHTML = '<b class="h">' + (hit ? "Richtig!" : "Nicht ganz.") + '</b>' + sp.text;
        $("#hnx").style.display = "flex"; found.add(sp.id); g.classList.add("found"); upd();
      });
    });
  });
  upd();
};

/* Datendeal: ja/nein mit Folge */
T.deal = s => {
  let k = 0, ja = 0; const gegeben = [];
  function show(){
    const d = s.angebote[k];
    stage.innerHTML = '<div class="card">' + head(s) + '<div class="count">Angebot ' + (k + 1) + ' von ' + s.angebote.length + '</div>' +
      '<div class="bigcard"><span class="ic">' + d.ic + '</span><span>Du bekommst: ' + d.du + '<br><span class="small muted" style="font-weight:400">Dafür gibst du: <b>' + d.gib + '</b></span></span></div>' +
      '<div class="opts two"><button class="opt g" id="ja">Mache ich mit</button><button class="opt r" id="nein">Nein danke</button></div><div class="fb" id="fb"></div><div id="nxw"></div></div>';
    $("#ja").onclick = () => ans(true); $("#nein").onclick = () => ans(false);
  }
  function ans(y){
    const d = s.angebote[k]; if (y) { ja++; gegeben.push(d.gib); }
    $("#ja").disabled = $("#nein").disabled = true; (y ? $("#ja") : $("#nein")).classList.add(y ? "ok" : "no");
    const fb = $("#fb"); fb.className = "fb show ok"; fb.innerHTML = '<b class="h">Was der Betrieb davon hat</b>' + d.betrieb;
    $("#nxw").innerHTML = '<div class="next"><button class="btn big" id="nk">' + (k + 1 < s.angebote.length ? "Nächstes Angebot →" : "Auswertung →") + '</button></div>';
    $("#nk").onclick = () => { k++; if (k < s.angebote.length) show(); else fin(); };
  }
  function fin(){
    stage.innerHTML = '<div class="card"><div class="kicker">Auswertung</div><h2>' + (ja === 0 ? "Du hast nichts verraten." : "Das weiß der Betrieb jetzt über dich") + '</h2>' +
      (ja ? '<ul class="lern">' + gegeben.map(g => '<li>' + g + '</li>').join("") + '</ul>' : '') + s.fazit(ja, s.angebote.length) + nextBtn() + '</div>';
    bindNext();
  }
  show();
};

/* Tourenplanung */
T.tour = s => {
  let route = [], tries = 0;
  const P = s.punkte, D = s.depot;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) * s.km;
  const len = r => { let l = 0, c = D; r.forEach(i => { l += dist(c, P[i]); c = P[i]; }); return l + dist(c, D); };
  const perms = a => a.length <= 1 ? [a] : a.flatMap((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).map(p => [x].concat(p)));
  const opt = Math.min(...perms(P.map((_, i) => i)).map(len));
  let first = null;
  function svg(){
    let lines = "", c = D;
    route.forEach(i => { lines += '<line x1="' + c.x + '" y1="' + c.y + '" x2="' + P[i].x + '" y2="' + P[i].y + '" stroke="#c8251d" stroke-width="4" stroke-linecap="round"/>'; c = P[i]; });
    if (route.length === P.length) lines += '<line x1="' + c.x + '" y1="' + c.y + '" x2="' + D.x + '" y2="' + D.y + '" stroke="#c8251d" stroke-width="4" stroke-dasharray="8 6"/>';
    return '<svg viewBox="0 0 600 420" role="img" aria-label="Vereinfachte Karte">' + s.hintergrund + lines +
      '<g><rect x="' + (D.x - 18) + '" y="' + (D.y - 18) + '" width="36" height="36" rx="6" fill="#c8251d"/><text x="' + D.x + '" y="' + (D.y + 6) + '" text-anchor="middle" style="fill:#fff;font-size:18px">🍓</text><text x="' + (D.x + 24) + '" y="' + (D.y + 34) + '">' + D.name + '</text></g>' +
      P.map((p, i) => { const pos = route.indexOf(i); return '<g class="stop' + (pos >= 0 ? ' sel' : '') + '" data-i="' + i + '"><circle cx="' + p.x + '" cy="' + p.y + '" r="17"/><text x="' + p.x + '" y="' + (p.y + 5) + '" text-anchor="middle">' + (pos >= 0 ? pos + 1 : p.k) + '</text><text x="' + (p.x + (p.lx || 22)) + '" y="' + (p.y + (p.ly || 5)) + '"' + (p.lx < 0 ? ' text-anchor="end"' : '') + '>' + p.name + '</text></g>'; }).join("") + '</svg>';
  }
  function show(){
    const full = route.length === P.length;
    stage.innerHTML = '<div class="card">' + head(s) + '<div class="map" id="map">' + svg() + '</div>' +
      '<div class="row" style="margin-top:10px;justify-content:space-between"><span class="count">Stopps: ' + route.length + ' von ' + P.length + (route.length ? ' · bisher ' + fmt(len(route) - dist(route.length ? P[route[route.length - 1]] : D, D)) + ' km' : '') + '</span>' +
      '<span class="row"><button class="btn alt" id="undo"' + (route.length ? '' : ' disabled') + '>Zurück</button></span></div><div class="fb" id="fb"></div><div id="nxw"></div></div>';
    stage.querySelectorAll(".stop").forEach(g => g.onclick = () => { const i = +g.dataset.i; if (route.includes(i) || full) return; route.push(i); show(); });
    $("#undo").onclick = () => { if (!full || !first) { route.pop(); show(); } };
    if (full) result();
  }
  function result(){
    const l = len(route); tries++;
    if (first === null) { first = l; const r = l / opt; add(r <= 1.03 ? 3 : r <= 1.15 ? 2 : 1, 3); }
    const mehr = l - opt;
    const fb = $("#fb"); fb.className = "fb show " + (mehr < 1 ? "ok" : "no");
    fb.innerHTML = '<b class="h">Eure Tour: ' + fmt(l) + ' km · beste Tour: ' + fmt(opt) + ' km</b>' +
      (mehr < 1 ? 'Perfekt geplant – kürzer geht es nicht.' : 'Ihr fahrt ' + fmt(mehr) + ' km zu viel. Bei ' + fmt(s.kosten, 2) + ' € pro km kostet das den Betrieb ' + fmt(mehr * s.kosten, 2) + ' € – jeden Tag, an dem so gefahren wird. Im Jahr (250 Tage) wären das ' + fmt(mehr * s.kosten * 250) + ' €.') +
      (s.nachher || '');
    $("#nxw").innerHTML = '<div class="row next">' + (mehr >= 1 ? '<button class="btn alt" id="again">Neue Tour versuchen</button>' : '') + '<button class="btn big" id="weiter">Weiter →</button></div>';
    bindNext(); const a = $("#again"); if (a) a.onclick = () => { route = []; show(); };
  }
  show();
};

function ende(){
  prog.style.width = "100%";
  const q = S.max ? S.score / S.max : 1, st = q >= .85 ? 3 : q >= .6 ? 2 : 1;
  const key = "lf5ein_m" + M.nr, old = +(store(key) || 0);
  if (S.score > old) store(key, S.score);
  const E = M.ende;
  stage.innerHTML = '<div class="card"><div class="kicker">Geschafft</div><h2>' + E.titel + '</h2>' +
    (S.max ? '<div class="stars" aria-label="' + st + ' von 3 Sternen">' + "★".repeat(st) + '<span style="opacity:.2">' + "★".repeat(3 - st) + '</span></div><p><b>' + S.score + ' von ' + S.max + ' Punkten</b>' + (old && S.score <= old ? ' · bisher bestes Ergebnis auf diesem Gerät: ' + old : '') + '</p>' : '') +
    '<div class="leit">' + E.leitfrage + '</div>' +
    '<div class="kicker" style="margin-top:14px">Das lernt ihr heute</div><ul class="lern">' + E.heute.map(x => '<li>' + x + '</li>').join("") + '</ul>' +
    '<div class="profi"><b class="h">Für Profis</b><br>' + E.profi + '</div>' +
    '<div class="next row"><button class="btn alt" id="nochmal">Nochmal spielen</button></div></div>';
  $("#nochmal").onclick = start;
}

shell(); start();
})();
