<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan-Dashboard 2026/27</title>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--ink:#1d2433;--mute:#5d6778;--line:#dde2ec;--brand:#2456c9;--brand-ink:#ffffff;
  --green:#1f9d55;--green-bg:#dcf5e5;--amber:#c27c0e;--amber-bg:#fdf0d2;--red:#d1342f;--red-bg:#fde0de;
  --off:#eceff5;--shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05);
  --c-Lernfelder:#2456c9;--c-Wiso:#8a3fc4;--c-Englisch:#0f8a8a;--c-Wahlpflicht:#c2661b;--c-Mathe:#4d7a1a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10141c;--card:#1a2030;--ink:#e8ecf5;--mute:#9aa5ba;--line:#2c3550;--brand:#6c97ff;--brand-ink:#0d1220;
  --green:#4fd18a;--green-bg:#17372a;--amber:#f0b44c;--amber-bg:#3c2f12;--red:#ff7b74;--red-bg:#44201f;--off:#222a3d;--shadow:none;
  --c-Lernfelder:#6c97ff;--c-Wiso:#c493f0;--c-Englisch:#4fd1d1;--c-Wahlpflicht:#f0a05c;--c-Mathe:#9ccf5a}
}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a2030;--ink:#e8ecf5;--mute:#9aa5ba;--line:#2c3550;--brand:#6c97ff;--brand-ink:#0d1220;
  --green:#4fd18a;--green-bg:#17372a;--amber:#f0b44c;--amber-bg:#3c2f12;--red:#ff7b74;--red-bg:#44201f;--off:#222a3d;--shadow:none;
  --c-Lernfelder:#6c97ff;--c-Wiso:#c493f0;--c-Englisch:#4fd1d1;--c-Wahlpflicht:#f0a05c;--c-Mathe:#9ccf5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:12.5px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:transparent;color:var(--mute);padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button:hover{background:var(--off)}
nav button.on{background:var(--brand);color:var(--brand-ink)}
main{max-width:1280px;margin:0 auto;padding:16px}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;background:var(--mute)}
.lamp.g{background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.lamp.y{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.lamp.r{background:var(--red);box-shadow:0 0 0 3px var(--red-bg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--red-bg)}}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--off);color:var(--mute)}
.badge.g{background:var(--green-bg);color:var(--green)}.badge.y{background:var(--amber-bg);color:var(--amber)}.badge.r{background:var(--red-bg);color:var(--red)}
.badge.A{background:#dbe7ff;color:#1b45a8}.badge.B{background:#ffe3cc;color:#a24b0a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:16px}
.card h2{margin:0 0 10px;font-size:17px}
.bar{height:8px;background:var(--off);border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--brand)}
.muted{color:var(--mute)}.small{font-size:12.5px}
button.b,a.b{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.b:hover,a.b:hover{border-color:var(--brand)}
button.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.d{color:var(--red)}
button.sm{padding:2px 8px;font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:100%}
textarea{width:100%}
label{display:inline-flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--off);font-size:13px}
.wk td{height:70px;min-width:130px;padding:4px}
.wk th.per{width:62px;text-align:center}
.wk th.hol,.wk td.hol{background:var(--off)}
.les{border-left:5px solid var(--cc,#888);background:var(--card);border-radius:6px;padding:4px 7px;margin-bottom:4px;box-shadow:0 0 0 1px var(--line);cursor:pointer;font-size:13px}
.les:hover{box-shadow:0 0 0 2px var(--brand)}
.les b{display:block;font-size:12.5px}
.les.off{background:var(--off);color:var(--mute);text-decoration:line-through;border-left-style:dashed}
.les.exam{background:var(--amber-bg)}
.les.free{opacity:.7}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:5px 12px}
.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.scroll{overflow-x:auto}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--off);border-radius:99px;padding:2px 4px 2px 10px;margin:2px;font-size:13px;font-weight:600}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--mute);font-size:14px;padding:0 3px}
.modalbg{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--card);border-radius:16px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px}
.banner{background:var(--amber-bg);color:var(--ink);border:1px solid var(--amber);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13.5px}
.tl td.dt{white-space:nowrap}
.shift{color:var(--red);font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:99;font-weight:600}
details{margin:8px 0}summary{cursor:pointer;font-weight:700}
.stu-item{padding:10px 0;border-bottom:1px solid var(--line)}
.stu-item p{margin:6px 0;background:var(--off);padding:8px 10px;border-radius:8px}
@media (max-width:700px){nav{margin-left:0}.wk td{min-width:110px}}
@media print{header nav,button{display:none!important}}
</style>
</head>

const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const fmt=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const fmtS=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.':'';
const todayIso=()=>S.settings.stichtag||iso(new Date());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clsName=id=>(S.classes.find(c=>c.id===id)||{name:id}).name;

/* Ferien / Feiertage / freie Tage / Fehltage */
const ferienAt=d=>FERIEN.find(f=>d>=f.f&&d<=f.t);
const feiertagAt=d=>FEIERTAGE.find(f=>f.d===d);
const freeAt=(d,cls)=>S.freeDays.find(f=>d>=f.from&&d<=(f.to||f.from)&&(!f.cls||f.cls===cls));
const absentAt=d=>S.absences.find(a=>d>=a.from&&d<=(a.to||a.from));
function weekFullyOff(mon){for(let i=0;i<5;i++){const d=iso(addDays(mon,i));if(!ferienAt(d)&&!feiertagAt(d))return false}return true}
const _wl=new Map();
function weekLetter(date){
  const mon=mondayOf(date),k=iso(mon)+S.settings.aMonday+S.settings.countFerienWeeks;
  if(_wl.has(k))return _wl.get(k);
  const a=mondayOf(D(S.settings.aMonday));let n=0;
  const step=mon>=a?1:-1;
  if(S.settings.countFerienWeeks){n=Math.round((mon-a)/(7*864e5))}
  else{let w=new Date(a);const lo=step>0?a:mon,hi=step>0?mon:a;for(w=new Date(lo);w<hi;w=addDays(w,7)){if(!weekFullyOff(w))n++}}
  const r=Math.abs(n)%2===0?'A':'B';_wl.set(k,r);return r;
}

/* =====================================================================
   STOFFPLAN-ENGINE
   ===================================================================== */
function kindOf(t){if(/Klausur|^Test\b|Präsentation „?Mein|Englisch – Präsentation/i.test(t)&&!/^Besprechung|vorbereiten/i.test(t))return'exam';
  if(/Puffer/i.test(t))return'buffer';if(/Wiederholung|Escape|Besprechung|Fehleranalyse/i.test(t))return'review';return'lesson'}
function courseUnits(c){
  const out=[];
  c.blocks.forEach(bid=>{const b=S.blocks[bid];if(!b)return;
    b.units.forEach((u,i)=>out.push({bid,idx:i,b,m:u.m,t:u.t,f:u.f,u:u.u,kind:kindOf(u.t),key:c.cls+'|'+bid+'|'+i}))});
  return out;
}
const perOrder=(a,b)=>a.per-b.per;
function offReason(di,cls,mode){
  const f=ferienAt(di);if(f)return f.n;
  if(!(mode==='soll'&&!S.settings.sollMitFeiertagen)){
    const h=feiertagAt(di);if(h)return h.n;
    const fr=freeAt(di,cls);if(fr)return fr.label||'Freier Tag';}
  if(mode==='ist'){const a=absentAt(di);if(a)return'Lehrkraft fehlt';}
  return null;
}
function examAt(di,c,slot){return S.exams.find(e=>e.date===di&&e.cls===c.cls&&e.subj===c.subj&&(e.per===''||e.per==null||Number(e.per)===slot.per))}
function schedule(c,mode){
  const units=courseUnits(c),slots=S.slots.filter(s=>s.cls===c.cls&&s.subj===c.subj);
  const out=[];let ui=Math.max(0,c.done||0);
  const start=c.start&&c.start>S.settings.yearStart?c.start:S.settings.yearStart;
  for(let d=D(start);iso(d)<=S.settings.yearEnd;d=addDays(d,1)){
    const wd=d.getDay();if(wd<1||wd>5)continue;
    const di=iso(d),L=weekLetter(d);
    slots.filter(s=>s.wd===wd&&(s.week==='AB'||s.week===L)).sort(perOrder).forEach(s=>{
      const l={date:di,slot:s,letter:L,course:c};const off=offReason(di,c.cls,mode);
      if(off){l.status='off';l.reason=off}
      else{const ex=examAt(di,c,s);
        if(ex){l.status='exam';l.exam=ex;const nu=units[ui];if(nu&&nu.kind==='exam'){l.unit=nu;l.ui=ui;ui++}else{l.extra=true}}
        else if(ui<units.length){l.status='unit';l.unit=units[ui];l.ui=ui;ui++}
        else l.status='free';}
      out.push(l)});
  }
  return {lessons:out,units,next:ui};
}
function courseStatus(c){
  const ist=schedule(c,'ist'),soll=schedule(c,'soll'),today=todayIso();
  const cnt=sc=>sc.lessons.filter(l=>l.date<=today&&l.unit).length;
  const doneIst=cnt(ist),doneSoll=cnt(soll);
  const lost=Math.max(0,doneSoll-doneIst-(c.gain||0));
  const hrs=lost*S.settings.hoursPerSlot;
  const col=lost<=0?'g':(hrs>S.settings.thresholdH?'r':'y');
  const overhang=Math.max(0,ist.units.length-ist.next);
  const nextL=ist.lessons.find(l=>l.date>=today&&(l.status==='unit'||l.status==='exam'));
  const lastL=[...ist.lessons].reverse().find(l=>l.unit);
  return {c,ist,soll,doneIst,doneSoll,lost,hrs,col,overhang,nextL,lastL,total:ist.units.length,done:(c.done||0)+doneIst};
}
const colLabel={g:'Im Zeitplan',y:'Leicht im Verzug',r:'Im Verzug'};
function allStatus(){return S.courses.map(courseStatus)}
function worst(sts){return sts.some(s=>s.col==='r')?'r':sts.some(s=>s.col==='y')?'y':'g'}

/* Material & Berichtsheft */
function matFor(u,cls){
  const ov=S.matOv[u.key];let m=(ov!=null&&ov!==''?ov:u.f)||'',auto=false;
  if(!m){auto=true;
    const mm=/M (\d+)/.exec(u.m||'');
    if(mm&&u.b.lf&&u.kind==='lesson')m='LF'+u.b.lf+' Modul '+mm[1]+' - Aufgaben.pdf';
    else m=u.bid+'-DS'+String(u.idx+1).padStart(2,'0')+'.pdf';}
  if(/^https?:\/\//i.test(m))return{url:m,name:m.replace(/^https?:\/\/(www\.)?/,'').slice(0,40),ext:true,auto};
  const path=m.includes('/')?m:'materials/'+m;
  return{url:encodeURI(path),name:m.replace(/^.*\//,'').replace(/\.pdf$/i,''),ext:false,auto,path};
}
function untisText(u,cls,subj){
  const ov=S.untisOv[u.key];if(ov)return ov;if(u.u)return u.u;
  const B=u.b.name.replace(/ – .*/,' „'+u.b.name.replace(/^.*? – /,'')+'“');
  const mod=u.m?' ('+u.m.replace('M ','Modul ')+')':'';
  const mat=matFor(u,cls).name,t=u.t;
  const sub=SUBJ_LABEL[subj];
  const head=subj==='Lernfelder'?B+mod:subj==='Wiso'?'Wirtschafts- und Sozialkunde':subj==='Englisch'?'Englisch im Einzelhandel':subj==='Mathe'?'Mathematik für Fachlageristen':'Wahlpflichtfach';
  if(u.kind==='exam')return `${head}: Schriftliche bzw. praktische Leistungsüberprüfung „${t}“ im Format der Abschlussprüfung; anschließend Selbsteinschätzung der erreichten Punkte und Auswertung der Ergebnisse.`;
  if(u.kind==='buffer')return `${head}: Rückgabe und Besprechung der Leistungsüberprüfung, Nachschreibtermin sowie Wiederholung offener Inhalte.`;
  if(u.kind==='review')return `${head}: Gezielte Wiederholung – ${t}; Festigung der Inhalte durch Lernspiel bzw. Prüfungsaufgaben und Auswertung der Ergebnisse im Plenum.`;
  let m;
  if((m=/^(.*) – Einstieg$/.exec(t)))return `${head}: Einstieg in das Thema „${m[1]}“ mit einem Situationsbeispiel; Erarbeitung der Grundlagen anhand von Fallbeispielen (Arbeitsblatt „${mat}“).`;
  if((m=/^(.*) – Training$/.exec(t)))return `${head}: Training zum Thema „${m[1]}“ mit Situationsaufgaben und Rollenspielen unter Verwendung des Arbeitsblatts „${mat}“; Rückmeldung durch Beobachtungsbogen und Lösungsblatt.`;
  if((m=/^(.*) – Selbsttest$/.exec(t)))return `${head}: Selbsttest zum Thema „${m[1]}“ am Rechner, Auswertung im Punktekonto und Ausfüllen der Kann-Liste.`;
  return `${head}: Erarbeitung des Themas „${t}“ anhand von Einstiegsmaterial, Fallbeispielen und Aufgaben (Arbeitsblatt „${mat}“); Ergebnissicherung im Unterrichtsgespräch und Kontrolle mit dem Lösungsblatt.`;
}

const $=(s,r=document)=>r.querySelector(s);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function copyText(t){
  const done=()=>toast('Kopiert ✓');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fb())}else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Bitte manuell kopieren')}a.remove()}
}

      <div class="small muted">${c.blocks.map(b=>esc((S.blocks[b]||{}).id||b)).join(' → ')}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="small">${s.done} von ${s.total} Einheiten (${pct} %) · Soll bis heute: ${(c.done||0)+s.doneSoll} · <b>Verzug: ${s.hrs} Std.</b> <span class="badge ${s.col}">${colLabel[s.col]}</span></div>
      <div class="small" style="margin-top:6px">${s.nextL?`Nächste: <b>${fmtS(s.nextL.date)}</b> – ${esc(s.nextL.unit?s.nextL.unit.t:s.nextL.exam.label||'Leistungsüberprüfung')}`:'Keine weitere Stunde mit Stoff geplant.'}</div>
      ${s.overhang?`<div class="small shift">⚠ Bis Schuljahresende ${S.settings.yearEnd.slice(8,10)+'.'+S.settings.yearEnd.slice(5,7)+'.'} fehlen Termine für ${s.overhang} Einheit(en).</div>`:(s.lastL?`<div class="small muted">Planende: ${fmt(s.lastL.date)}</div>`:'')}
      <div class="row"><button class="b sm" data-act="timeline" data-c="${c.id}">Verlauf & Verschiebung</button></div></div>`}).join('')+'</div>';
  return h;

function lessonLine(l){
  const c=l.course;
  let txt=l.status==='off'?`<span class="muted">entfällt (${esc(l.reason)})</span>`:l.status==='free'?'<span class="muted">kein Stoff mehr hinterlegt</span>':esc(l.unit?l.unit.t:('Leistungsüberprüfung'+(l.exam&&l.exam.label?': '+l.exam.label:'')));
  return `<div class="les ${l.status}" ${subjColor(c.subj)} data-act="lesson" data-c="${c.id}" data-d="${l.date}" data-s="${l.slot.id}"><b>${PERIODS[l.slot.per]} · ${esc(clsName(c.cls))} · ${SUBJ_LABEL[c.subj]}</b>${txt}</div>`;
}

/* ---------- Wochenplan ---------- */
function vWeek(){
  if(!WEEK)WEEK=iso(mondayOf(D(todayIso())));
  const mon=D(WEEK),L=weekLetter(mon);
  const sts=S.courses.map(c=>({c,sc:schedule(c,'ist')}));
  const days=[1,2,3,4,5].map(i=>addDays(mon,i-1));
  const usedPer=new Set([0,1,2]);S.slots.forEach(s=>usedPer.add(s.per));
  const maxP=Math.max(...usedPer);
  let h=`<div class="row"><button class="b" data-act="wk" data-n="-1">‹ Woche zurück</button><button class="b" data-act="wk" data-n="0">Heute</button><button class="b" data-act="wk" data-n="1">Woche vor ›</button>
   <h2 style="margin:0 8px">KW ${isoWeek(mon)} · <span class="badge ${L}">${L}-Woche</span></h2><span class="muted small">${fmt(iso(days[0]))} – ${fmt(iso(days[4]))}</span></div>`;
  h+='<div class="scroll"><table class="wk"><tr><th class="per"></th>'+days.map(d=>{const di=iso(d),f=ferienAt(di),ft=feiertagAt(di);return `<th class="${f||ft?'hol':''}">${WDL[d.getDay()]} ${fmtS(di)}${f?`<div class="small muted">${esc(f.n)}</div>`:''}${ft?`<div class="small muted">${esc(ft.n)}</div>`:''}</th>`}).join('')+'</tr>';
  for(let p=0;p<=maxP;p++){
    h+=`<tr><th class="per">${PERIODS[p]}</th>`;
    days.forEach(d=>{const di=iso(d);const cell=[];
      sts.forEach(({c,sc})=>sc.lessons.forEach(l=>{if(l.date===di&&l.slot.per===p)cell.push(l)}));
      h+=`<td class="${ferienAt(di)||feiertagAt(di)?'hol':''}">${cell.map(lessonLine).join('')}</td>`});
    h+='</tr>';
  }
  h+='</table></div><p class="muted small">Klick auf eine Stunde: Material, Klassenbuch-Eintrag (Untis), Klausur eintragen oder Fehltag setzen. Ausgefallene Stunden sind durchgestrichen – der Stoff rückt automatisch nach.</p>';
  return h;
}

function fillSubj(clsId,subId){
  const c=S.classes.find(x=>x.id===($('#'+clsId)||{}).value);const sel=$('#'+subId);if(!sel||!c)return;

}

/* ---------- Schüleransicht ---------- */
function vStu(){
  const classes=S.classes.filter(c=>S.courses.some(x=>x.cls===c.id));
  if(!STU_CLS||!classes.some(c=>c.id===STU_CLS))STU_CLS=(classes[0]||{}).id||'';
  const today=todayIso();
  const items=[];
  S.courses.filter(c=>c.cls===STU_CLS).forEach(c=>{
    schedule(c,'ist').lessons.forEach(l=>{if(l.date<=today&&l.unit)items.push(l)})});
  items.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.slot.per-b.slot.per);
  let h=(STU_NOTE?`<div class="banner">${esc(STU_NOTE)}</div>`:'')+`<div class="card"><div class="row"><label>Klasse<select data-act="stucls">${classes.map(c=>`<option value="${c.id}" ${c.id===STU_CLS?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
   <button class="b" data-act="stuall">Alle Einträge kopieren</button></div>
   <div class="muted small">Jeder Eintrag ist so formuliert, dass du ihn direkt in dein Berichtsheft / deinen Ausbildungsnachweis übernehmen kannst.</div></div>`;
  h+='<div class="card" style="margin-top:12px">'+(items.length?items.map(l=>{
    const t=untisText(l.unit,l.course.cls,l.course.subj);
    return `<div class="stu-item"><b>${fmt(l.date)} · ${SUBJ_LABEL[l.course.subj]} · ${PERIODS[l.slot.per]} Std.</b><div class="muted small">${esc(l.unit.t)}</div><p>${esc(t)}</p>
      <button class="b sm" data-act="stucopy" data-t="${esc(t)}">Text kopieren</button> <button class="b sm" data-act="stucopy" data-t="${esc(fmt(l.date)+' – '+t)}">mit Datum kopieren</button>
      ${matLinkHtml(l.unit,l.course.cls)}</div>`}).join(''):'<div class="muted">Noch keine Einträge vorhanden.</div>')+'</div>';
  return h;
}

function closeModal(){$('#modal').innerHTML=''}
function openModal(html){$('#modal').innerHTML=`<div class="modalbg" data-act="mbg"><div class="modal">${html}</div></div>`}
function lessonModal(cid,d,sid){
  const c=S.courses.find(x=>x.id===cid);const sc=schedule(c,'ist');
  const l=sc.lessons.find(x=>x.date===d&&x.slot.id===sid);if(!l)return;
  const head=`<div class="row" style="margin:0"><h2>${esc(clsName(c.cls))} · ${SUBJ_LABEL[c.subj]}</h2><button class="b" style="margin-left:auto" data-act="close">Schließen</button></div>
   <div class="muted">${WDL[l.slot.wd]}, ${fmt(d)} · ${PERIODS[l.slot.per]} Std. · <span class="badge ${l.letter}">${l.letter}-Woche</span></div>`;
  let body='';
  if(l.status==='off')body=`<p><b>Entfällt:</b> ${esc(l.reason)}. Der Stoff rückt auf den nächsten Termin.</p>`;
  else if(l.status==='free')body='<p class="muted">Für diese Stunde ist kein Stoff hinterlegt (Plan abgeschlossen). Block im Tab „Klassen & Stoffplan“ ergänzen.</p>';
  else if(!l.unit)body=`<p><b>Leistungsüberprüfung:</b> ${esc(l.exam.label||'')}<br><span class="muted">Zusätzliche Stunde – der Stoff ist um eine Einheit verschoben.</span></p>`;
  if(l.unit){
    const u=l.unit,m=matFor(u,c.cls),t=untisText(u,c.cls,c.subj);
    body+=`<h3>${esc(u.t)}</h3><div class="muted small">${esc(u.b.name)}${u.m?' · '+esc(u.m):''} · Einheit ${u.idx+1} von ${u.b.units.length}${l.exam?' · <b>Klausurtermin</b>':''}</div>
     <label style="display:flex;margin-top:10px">Material (Weblink oder Dateiname im Ordner materials/)
       <input id="lm_mat" value="${esc(S.matOv[u.key]||u.f||'')}" placeholder="${esc(m.path||m.url)}"></label>
     <div class="row"><button class="b p" data-act="savemat" data-k="${esc(u.key)}">Material speichern</button>
       <a class="b" href="${esc(m.url)}" target="_blank" rel="noopener">${m.ext?'Link öffnen':'PDF öffnen'}: ${esc(m.name)}</a>${m.auto?'<span class="muted small">(Standardpfad – Datei muss im Repo liegen)</span>':''}</div>
     <label style="display:flex;margin-top:10px">Eintrag für Klassenbuch (Untis) / Berichtsheft
       <textarea id="lm_txt" rows="5">${esc(t)}</textarea></label>
     <div class="row"><button class="b p" data-act="copyfield" data-f="lm_txt">In Zwischenablage kopieren</button>
       <button class="b" data-act="saveuntis" data-k="${esc(u.key)}">Text für diese Klasse speichern</button>
       <button class="b" data-act="resetuntis" data-k="${esc(u.key)}">Automatischen Text wiederherstellen</button></div>`;
  }
  body+=`<hr><div class="row"><button class="b" data-act="quickabs" data-d="${d}">Ich fehle an diesem Tag</button>
    <button class="b" data-act="quickexam" data-c="${c.id}" data-d="${d}" data-p="${l.slot.per}">Klausur auf diese Stunde legen</button></div>`;
  openModal(head+body);
}
function timelineModal(cid){
  const c=S.courses.find(x=>x.id===cid),st=courseStatus(c);
  const sollDate=new Map(st.soll.lessons.filter(l=>l.unit).map(l=>[l.ui,l.date]));
  const istDate=new Map(st.ist.lessons.filter(l=>l.unit).map(l=>[l.ui,l.date]));
  const rows=st.ist.units.map((u,i)=>{
    const si=sollDate.get(i),ii=istDate.get(i);
    const wks=si&&ii?Math.round((D(ii)-D(si))/(7*864e5)):0;
    return `<tr><td>${i+1}</td><td>${esc(u.m)}</td><td>${esc(u.t)}</td><td class="dt">${si?fmtS(si):'–'}</td><td class="dt">${ii?fmtS(ii):'<span class="shift">kein Termin</span>'}</td><td>${wks>0?`<span class="shift">+${wks} Wo.</span>`:''}</td></tr>`}).join('');
  openModal(`<div class="row" style="margin:0"><h2>${lamp(st.col)}${esc(clsName(c.cls))} · ${SUBJ_LABEL[c.subj]}</h2><button class="b" style="margin-left:auto" data-act="close">Schließen</button></div>
   <div class="muted small">Soll = Plan ohne deine Fehltage · Ist = aktueller Stand mit Ausfällen und Klausuren. Verzug: ${st.hrs} Std.</div>
   <div class="scroll"><table class="tl"><tr><th>#</th><th>Modul</th><th>Thema</th><th>Soll</th><th>Ist</th><th></th></tr>${rows}</table></div>`);
}

   out.sort((a,b)=>a.date<b.date?-1:1);copyText(out.map(l=>fmt(l.date)+' – '+untisText(l.unit,l.course.cls,l.course.subj)).join('\n\n'))},
};
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;if(t.tagName==='SELECT'||t.tagName==='INPUT')return;if(a==='mbg'&&e.target!==t)return;
  if(A[a]){if(a==='delslot'||a==='lesson'||true)e.stopPropagation();A[a](e,t)}});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='imp'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.slots||!o.courses)throw new Error('Keine gültige Sicherung');adopt(o);save();render();toast('Import erfolgreich')}catch(x){alert('Import fehlgeschlagen: '+x.message)}};r.readAsText(f);return}
  const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='slsubj')fillSubj('sl_cls','sl_sub');
  else if(a==='ncsubj')fillSubj('nc_cls','nc_sub');
  else if(a==='blkadd'){if(t.value){const c=S.courses.find(x=>x.id===t.dataset.c);c.blocks.push(t.value);save();render()}}
  else if(a==='blksel'){A.blksel(e,t)}
  else if(a==='cfld'){const c=S.courses.find(x=>x.id===t.dataset.c);const f=t.dataset.f;c[f]=(f==='start')?t.value:Math.max(0,+t.value||0);save();render()}
  else if(a==='set'){S.settings[t.dataset.f]=(t.type==='number')?(+t.value||0):t.value;save();render()}
  else if(a==='setb'){S.settings[t.dataset.f]=t.checked;save();render()}
  else if(a==='stucls'){STU_CLS=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('ansicht')==='schueler'){
    STUDENT=true;VIEW='stu';STU_CLS=q.get('klasse')||'';
    fetch('stundenplan_oeffentlich.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(o=>{adopt(o)}).catch(()=>{load();STU_NOTE='Vorschau mit lokalen Daten (stundenplan_oeffentlich.json wurde nicht gefunden).'}).finally(render);
  }else{load();render();}
})();
</script>
