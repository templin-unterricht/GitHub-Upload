<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan-Dashboard 2026/27</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2433;--mut:#5d6b82;--line:#dce2ee;--pri:#2457c5;--priink:#fff;--g:#14894c;--gbg:#e0f4e9;--y:#9a6a00;--ybg:#fff1cc;--r:#c9302c;--rbg:#fde4e3;--free:#eceff5;--a:#2457c5;--b:#8a3fc0}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#192030;--ink:#e8ecf5;--mut:#9aa7bf;--line:#2b3548;--pri:#6c97f0;--priink:#0b1020;--g:#4cd08a;--gbg:#113423;--y:#f0b93a;--ybg:#3a2f0e;--r:#ff7b78;--rbg:#451a1b;--free:#222a3a;--a:#7da5ff;--b:#c99aff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.hinfo{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;max-width:1300px;margin:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
main{max-width:1300px;margin:auto;padding:12px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 8px}.card h3{font-size:15px;margin:12px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .wk{font-weight:600;flex:1;min-width:200px;text-align:center}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
button:hover,.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.btn.sm{padding:3px 8px;font-size:12.5px}.btn.ghost{background:transparent}
.btn.danger{color:var(--r)}
.lnk{border:0;background:none;color:var(--pri);padding:0;font-size:12px;text-decoration:underline;display:block;margin:3px auto 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 8px;max-width:100%}
textarea{width:100%;min-height:60px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:2px}
.abbadge{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;margin-right:6px}
.ab-A{background:var(--a)}.ab-B{background:var(--b)}
table{border-collapse:collapse;width:100%}
.wt th,.wt td{border:1px solid var(--line);vertical-align:top;padding:6px}
.wt th{background:var(--free);text-align:center;font-size:14px}
.wt th.today{outline:2px solid var(--pri);outline-offset:-2px}
.wt th.free{background:repeating-linear-gradient(45deg,var(--free),var(--free) 8px,var(--card) 8px,var(--card) 16px)}
.wt th .tag{font-weight:400;font-size:12px;color:var(--mut)}
.wt td.p{width:64px;text-align:center;font-size:12px;color:var(--mut);background:var(--free)}
.les{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:8px;padding:6px 8px;background:var(--card);font-size:13.5px}
.les-h{display:flex;gap:6px;align-items:center;font-weight:600}.les-h .fa{color:var(--mut);font-weight:400}
.dot{width:12px;height:12px;border-radius:50%;margin-left:auto}
.amp-gruen{background:var(--g)}.amp-gelb{background:#e0a400}.amp-rot{background:var(--r)}
.les.st-ferien,.les.st-feiertag,.les.st-frei{border-left-color:#9aa4b8;background:var(--free);color:var(--mut)}
.les.st-fehlt{border-left-color:#e0a400;background:var(--ybg)}
.les.st-klausur{border-left-color:var(--b)}
.les.st-puffer{border-left-color:var(--g)}
.topic{font-weight:600;margin-top:3px}.sub{color:var(--mut);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:13px}
.badge.gruen{background:var(--gbg);color:var(--g)}.badge.gelb{background:var(--ybg);color:var(--y)}.badge.rot{background:var(--r);color:#fff;box-shadow:0 0 0 3px var(--rbg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--rbg)}}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.cell{border:1px solid var(--line);border-radius:8px;padding:5px;display:grid;gap:4px;background:var(--card);min-width:110px}
.cell select{width:100%;padding:3px 4px;font-size:13px}
.sub-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-nav button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.warn{background:var(--ybg);border:1px solid #e0a400;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:10px}
.mod{display:grid;grid-template-columns:auto 60px 1fr 70px 1.2fr auto;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.mod .full{grid-column:2/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--free);color:var(--mut)}
.pill.fehlt{background:var(--ybg);color:var(--y)}.pill.klausur{background:#ece0f8;color:#6a2fa5}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:30}
#toast.err{background:var(--r)}
footer{max-width:1300px;margin:auto;padding:0 16px 40px}
footer .card{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-size:12.5px;color:var(--mut)}
@media(max-width:900px){
 .wt thead{display:none}.wt,.wt tbody,.wt tr,.wt td{display:block;width:100%}
 .wt td{border:0;padding:3px 0}.wt td.p{background:none;text-align:left;font-weight:600;margin-top:10px}
 .wt td.empty{display:none}.wt td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--mut)}
 .mod{grid-template-columns:auto 1fr}.mod .full{grid-column:1/-1}
}
</style>
</head>

 {nr:1,name:'Sozialversicherungen',ds:10,flag:true,inhalte:['Prinzipien des Sozialstaats','Krankenversicherung','Pflegeversicherung','Rentenversicherung','Arbeitslosenversicherung','Unfallversicherung','Beitragsberechnung und Arbeitgeberanteil']},
 {nr:2,name:'Einzelarbeitsvertrag',ds:8,flag:true,inhalte:['Arbeitsvertrag: Inhalte und Form','Pflichten aus dem Arbeitsvertrag','Arbeitszeit und Urlaub','Kündigung und Kündigungsschutz','Arbeitszeugnis','Entgeltabrechnung lesen']},

/* V26 = 1. Ausbildungsjahr, V25 = 2. Ausbildungsjahr (Reihenfolge im 2. Jahr: LF 6, 7, 9, 10, 8) */
function curriculumFor(klasse,fach){
 const jahr1=!/^V25/.test(klasse);
 if(fach==='Lernfelder')return (jahr1?[1,2,3,4,5]:[6,7,9,10,8]).map(n=>Object.assign({nr:n},LF[n]));
 if(fach==='Wiso')return jahr1?WISO1:WISO2;

/* ================= HELFER ================= */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const wd=s=>(parse(s).getDay()+6)%7;
const mondayOf=s=>addDays(s,-wd(s));
const de=s=>{const [y,m,d]=s.split('-');return d+'.'+m+'.'+y;};
const deShort=s=>{const [,m,d]=s.split('-');return d+'.'+m+'.';};
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function presetSlots(){
 const S={};const set=(w,d,p,k,f)=>S[w+'|'+d+'|'+p]={klasse:k,fach:f};
 ['A','B'].forEach(w=>{

function defaultChain(klasse,fach){return {start:'',modules:curriculumFor(klasse,fach).map(m=>({id:'m'+m.nr,nr:m.nr,name:m.name,ds:m.ds,on:true,link:'',inhalte:m.inhalte.join('; '),check:!!m.flag}))};}

function normalize(j){
 const b=defaultState();
 const o=Object.assign({},b,j,{settings:Object.assign({},b.settings,j.settings||{})});
 ['customDays','absences','exams'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
 if(!o.slots||typeof o.slots!=='object')o.slots={};
 if(!o.texts||typeof o.texts!=='object')o.texts={};
 if(!Array.isArray(o.settings.periods)||o.settings.periods.length<4)o.settings.periods=b.settings.periods;
 const ver=j.version||1;
 o.chains=ver<3?b.chains:Object.assign({},b.chains,j.chains||{});
 if(ver<2)o.texts={};
 if(ver<3){o.slots=b.slots;o.settings.refA=b.settings.refA;o.settings.periods=b.settings.periods;}
 o.version=3;

 return o;
}

/* ================= KALENDER-LOGIK ================= */
function dayInfo(s){
 for(const f of FERIEN)if(s>=f.from&&s<=f.to)return {type:'ferien',name:f.name};
 if(FEIERTAGE[s])return {type:'feiertag',name:FEIERTAGE[s]};
 const c=state.customDays.find(x=>x.date===s);
 if(c)return {type:'frei',name:c.name||'Schulfrei'};
 return null;
}
function weekFree(m){for(let i=0;i<5;i++)if(!dayInfo(addDays(m,i)))return false;return true;}
function buildAB(){
 AB={};const S=state.settings;const ref=mondayOf(S.refA||'2026-10-26');
 const first=mondayOf(addDays(S.planStart<ref?S.planStart:ref,-21)),last=mondayOf(addDays(PLAN_END,28));
 if(!S.skipHolidayWeeks){
  for(let m=first;m<=last;m=addDays(m,7)){const diff=Math.round((parse(m)-parse(ref))/6048e5);AB[m]=((diff%2)+2)%2===0?'A':'B';}
  return;
 }
 AB[ref]='A';
 let lab='A';
 for(let m=addDays(ref,7);m<=last;m=addDays(m,7)){if(weekFree(m))AB[m]=lab==='A'?'B':'A';else{lab=lab==='A'?'B':'A';AB[m]=lab;}}
 lab='A';
 for(let m=addDays(ref,-7);m>=first;m=addDays(m,-7)){if(weekFree(m))AB[m]=lab==='A'?'B':'A';else{lab=lab==='A'?'B':'A';AB[m]=lab;}}
}
const abOf=s=>AB[mondayOf(s)]||'A';

/* ================= STOFFKETTEN-BERECHNUNG (Rutsch-Effekt) ================= */
function compute(){
 buildAB();
 C={chains:{},byDate:{},occById:{}};
 const S=state.settings,today=S.stichtag||todayStr();
 const slots=Object.entries(state.slots).map(([k,v])=>{const p=k.split('|');return {w:p[0],d:+p[1],p:+p[2],klasse:v.klasse,fach:v.fach};}).filter(s=>s.klasse&&s.fach);
 const keys=[...new Set(slots.map(s=>s.klasse+'|'+s.fach))];
 keys.forEach(key=>{
  const ch=state.chains[key];if(!ch)return;
  const sp=key.split('|'),klasse=sp[0],fach=sp[1];
  const units=[];
  ch.modules.filter(m=>m.on).forEach(m=>{for(let i=1;i<=m.ds;i++)units.push({mod:m,dsNo:i,total:m.ds,fach});});
  const mine=slots.filter(s=>s.klasse===klasse&&s.fach===fach);
  const from=ch.start&&ch.start>S.planStart?ch.start:S.planStart;
  const occ=[];let u=0;
  for(let d=from;d<=PLAN_END;d=addDays(d,1)){
   const w=wd(d);if(w>4)continue;
   const todays=mine.filter(s=>s.w===abOf(d)&&s.d===w).sort((a,b)=>a.p-b.p);
   if(!todays.length)continue;
   const info=dayInfo(d);
   const absent=state.absences.some(a=>d>=a.from&&d<=(a.to||a.from));
   const exam=state.exams.find(e=>e.date===d&&e.klasse===klasse&&e.fach===fach);
   todays.forEach(s=>{
    const o={id:key+'@'+d+'@'+s.p,date:d,period:s.p,klasse,fach,key};
    if(info){o.status=info.type;o.label=info.name;}
    else if(absent)o.status='fehlt';
    else if(exam){o.status='klausur';o.exam=exam;}
    else if(u<units.length){o.status='unterricht';o.unit=units[u++];}
    else o.status='puffer';
    occ.push(o);C.occById[o.id]=o;(C.byDate[d]=C.byDate[d]||[]).push(o);
   });
  }
  const past=occ.filter(o=>o.date<today);
  const soll=Math.min(units.length,past.filter(o=>o.status!=='ferien'&&o.status!=='frei').length);
  const ist=past.filter(o=>o.status==='unterricht').length;
  const verzugDS=Math.max(0,soll-ist),verzugStd=verzugDS*2;
  const amp=verzugStd===0?'gruen':verzugStd<=4?'gelb':'rot';
  const planned=occ.filter(o=>o.unit);
  C.chains[key]={key,klasse,fach,units,occ,soll,ist,verzugDS,verzugStd,amp,
   current:units[ist]||null,open:units.length-planned.length,
   end:planned.length?planned[planned.length-1].date:null};
 });
}
const chainsList=()=>Object.values(C.chains).sort((a,b)=>KLASSEN.findIndex(k=>k.id===a.klasse)-KLASSEN.findIndex(k=>k.id===b.klasse)||a.fach.localeCompare(b.fach));

function rawTeil(u){
 const l=(u.mod.inhalte||'').split(/;|\n/).map(x=>x.trim()).filter(Boolean);
 if(!l.length)return u.mod.name;
 return l[Math.min(l.length-1,Math.floor((u.dsNo-1)*l.length/u.total))];
}
const teilthema=u=>rawTeil(u).replace(/^!\s*/,'');
const isLeistung=u=>/^!/.test(rawTeil(u));
const textKey=o=>[o.klasse,o.fach,o.unit.mod.id,o.unit.dsNo].join('|');
function autoText(o){
 const u=o.unit,t=teilthema(u),m=u.mod.name,n=u.mod.nr,f=o.fach;
 const lf=f==='Lernfelder',kind=lf?'Lernfeld':'Modul',gen=lf?'des Lernfelds':'des Moduls',tag=tagOf(f,n);
 const work=f==='Mathe'?'anhand von Rechenaufgaben aus dem Lageralltag':f==='Englisch'?'anhand von Dialogen, Wortschatzarbeit und Rollenspielen':'anhand von Fallbeispielen aus der Praxis';
 const ab=` (Arbeitsblatt ${tag}, Teil ${u.dsNo})`;
 if(isLeistung(u))return `Leistungsüberprüfung im Fach ${f}: ${t} (${kind} „${m}“).`;
 if(u.dsNo===1)return `Einstieg in das ${kind} „${m}“: Aktivierung des Vorwissens und Klärung zentraler Fachbegriffe; Erarbeitung des Teilthemas „${t}“ ${work} unter Verwendung des Arbeitsblatts ${tag}, Teil 1.`;
 if(u.dsNo===u.total)return `Zusammenfassung und Sicherung ${gen} „${m}“: Wiederholung der zentralen Inhalte (Schwerpunkt „${t}“), Anwendung ${work} sowie Reflexion des eigenen Lernstands${ab}.`;
 const v=u.dsNo%3;
 if(v===0)return `Detaillierte Erarbeitung des Themas „${t}“ ${work} in Partnerarbeit; Sicherung und Besprechung der Ergebnisse im Plenum${ab}.`;
 if(v===1)return `Vertiefung und Anwendung des Themas „${t}“ im ${kind} „${m}“ ${work}; Präsentation und Auswertung der Arbeitsergebnisse${ab}.`;
 return `Erarbeitung des Themas „${t}“ (${kind} „${m}“) anhand von Informationstexten, Beispielen und Übungsaufgaben; schriftliche Ergebnissicherung im Heft${ab}.`;
}
function entryText(o){
 if(o.status==='klausur')return `Schriftliche Leistungsüberprüfung (Klausur) im Fach ${o.fach}.`;
 if(!o.unit)return '';
 const c=state.texts[textKey(o)];
 return c?c:autoText(o);
}

     <select data-role="f" ${typ?'':'disabled'}>${(typ?FAECHER[typ]:[]).map(f=>`<option ${f===s.fach?'selected':''}>${f}</option>`).join('')}</select></div></td>`;
    }
    h+='</tr>';
   });
   h+='</tbody></table></div></div>';
  });
 }
 if(ui.adminSec==='klassen'){
  const typ=typOf(ui.adminKlasse);
  h+=`<div class="card"><div class="row"><div><label>Klasse</label>${klasseSelect('data-ui="adminKlasse"',ui.adminKlasse)}</div>
  <div><label>Stoffplan übernehmen von</label>${klasseSelect('id="cpFrom"',ui.adminKlasse==='V26/1'?'V26/2':'V26/1')}</div><button data-act="copyChain">Übernehmen</button></div>
  <p class="small">Lege fest, welche Module diese Klasse in welchem Fach bekommt (Haken), wie viele Doppelstunden (DS) sie dauern und welches Material gilt. Bereits abgeschlossene Module einfach abwählen oder den Beginn der Themenkette setzen. Teilthemen (mit Semikolon getrennt) werden auf die Doppelstunden verteilt und fließen in die Klassenbuch-Einträge ein. Ohne Weblink wird automatisch <code>materials/${esc(slug(ui.adminKlasse))}_Fach_ModulN.pdf</code> verwendet.</p></div>`;
  FAECHER[typ].forEach(f=>{
   const key=ui.adminKlasse+'|'+f,ch=state.chains[key],bp='chains.'+key;
   h+=`<div class="card"><h2>${esc(f)}</h2><div class="row"><div><label>Beginn der Themenkette (leer = Planstart)</label><input type="date" ${bind(bp+'.start')} value="${esc(ch.start)}"></div></div>`;
   ch.modules.forEach((m,i)=>{
    const mp=bp+'.modules.'+i;
    h+=`<div class="mod"><input type="checkbox" ${bind(mp+'.on','data-t="b"')} ${m.on?'checked':''} title="Modul unterrichten">
    <input type="text" ${bind(mp+'.nr','data-t="n"')} value="${m.nr}" title="Modul-Nr." style="width:60px">
    <input type="text" ${bind(mp+'.name')} value="${esc(m.name)}" placeholder="Modulname">
    <input type="number" min="1" ${bind(mp+'.ds','data-t="n"')} value="${m.ds}" title="Doppelstunden">
    <input type="text" ${bind(mp+'.link')} value="${esc(m.link)}" placeholder="Weblink (Dropbox/OneDrive) – sonst materials/…">
    <button class="btn sm danger" data-act="delMod" data-key="${esc(key)}" data-i="${i}">✕</button>
    <div class="full">${m.check?'<div class="small" style="color:var(--y);margin-bottom:3px">Umfang geschätzt – bitte Doppelstunden prüfen</div>':''}<textarea ${bind(mp+'.inhalte')} placeholder="Teilthemen, durch Semikolon getrennt (! vorn = Leistungsüberprüfung)">${esc(m.inhalte)}</textarea></div></div>`;
   });
   h+=`<button data-act="addMod" data-key="${esc(key)}" style="margin-top:8px">+ Modul hinzufügen</button></div>`;
  });
 }
 if(ui.adminSec==='fehl'){
  h+=`<div class="card"><h2>Eigene Fehltage (Lehrkraft)</h2><div class="warn">Datenschutz: Hier werden ausschließlich deine eigenen Fehltage erfasst – keine Schülerdaten. Trage keine Gründe wie Krankheit ein; die Notiz wird im Backup gespeichert, in der Schüleransicht aber nicht angezeigt.</div>
  <div class="row"><div><label>Von</label><input type="date" id="absFrom"></div><div><label>Bis (optional)</label><input type="date" id="absTo"></div><div><label>Neutrale Notiz (optional)</label><input type="text" id="absNote" placeholder="z. B. Fortbildung"></div><button class="btn pri" data-act="addAbs">Hinzufügen</button></div>
  ${listRows(state.absences.slice().sort((a,b)=>a.from.localeCompare(b.from)),a=>`${de(a.from)}${a.to&&a.to!==a.from?' – '+de(a.to):''} ${a.note?'· '+esc(a.note):''}`,'delAbs')}</div>`;
 }
 if(ui.adminSec==='klausur'){
  h+=`<div class="card"><h2>Klausuren</h2><p class="small">Ein Klausurtermin verbraucht keinen neuen Stoff; alle folgenden Themen dieses Fachs in dieser Klasse rutschen um eine Doppelstunde weiter. (Geht auch direkt im Wochenplan per „Klausur“-Knopf.)</p>
  <div class="row"><div><label>Datum</label><input type="date" id="exDate"></div><div><label>Klasse</label>${klasseSelect('id="exK" data-role="exK"',ui.adminKlasse)}</div><div><label>Fach</label><select id="exF"></select></div><div><label>Notiz</label><input type="text" id="exNote" placeholder="optional"></div><button class="btn pri" data-act="addExam">Hinzufügen</button></div>
  ${listRows(state.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)),e=>`${de(e.date)} · ${esc(e.klasse)} · ${esc(e.fach)} ${e.note?'· '+esc(e.note):''}`,'delExam')}</div>`;
 }
 if(ui.adminSec==='frei'){
  h+=`<div class="card"><h2>Schulspezifische freie Tage</h2><p class="small">z. B. Studientage oder Zeugniskonferenzen – an diesen Tagen entfällt der Unterricht ohne Stoffverbrauch und ohne Verzug.</p>
  <div class="row"><div><label>Datum</label><input type="date" id="frDate"></div><div><label>Bezeichnung</label><input type="text" id="frName" placeholder="z. B. Studientag"></div><button class="btn pri" data-act="addFree">Hinzufügen</button></div>
  ${listRows(state.customDays.slice().sort((a,b)=>a.date.localeCompare(b.date)),c=>`${de(c.date)} · ${esc(c.name)}`,'delFree')}</div>
  <div class="card"><h2>Fest hinterlegt: Ferien &amp; Feiertage (Bremen 2026/27)</h2><p class="small"><b>Ferien:</b> ${FERIEN.map(f=>`${esc(f.name)} ${de(f.from)}${f.to!==f.from?' – '+de(f.to):''}`).join(' · ')}<br><b>Feiertage:</b> ${Object.entries(FEIERTAGE).map(e=>`${deShort(e[0])} ${esc(e[1])}`).join(' · ')}</p></div>`;
 }
 if(ui.adminSec==='einst'){
  h+=`<div class="card"><h2>Rhythmus &amp; Auswertung</h2><div class="row">
  <div><label>Montag einer A-Woche (Referenz)</label><input type="date" ${bind('settings.refA')} value="${esc(S.refA)}"></div>
  <div><label>Planstart (erster Schultag, Beginn der Berechnung)</label><input type="date" ${bind('settings.planStart')} value="${esc(S.planStart)}"></div>
  <div><label>Stichtag für die Ampel (leer = heute)</label><input type="date" ${bind('settings.stichtag')} value="${esc(S.stichtag)}"></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" ${bind('settings.skipHolidayWeeks','data-t="b"')} ${S.skipHolidayWeeks?'checked':''}> Komplett unterrichtsfreie Wochen zählen nicht für den A/B-Wechsel</label>
  <h3>Bezeichnung der Doppelstunden</h3><div class="row">${[0,1,2,3].map(i=>`<input type="text" ${bind('settings.periods.'+i)} value="${esc(S.periods[i])}" style="width:130px">`).join('')}</div>
  <p class="small">Nach Änderungen an Referenzwoche oder Planstart die Seite per Wechsel des Tabs neu laden lassen – die Berechnung aktualisiert sich automatisch.</p></div>
  <div class="card"><h2>Schüler-Links</h2><p class="small">Die Schüleransicht liest die Datei <code>stundenplan_backup.json</code> aus dem GitHub-Repository (neben der <code>index.html</code>). Nach Planänderungen: „Planungsdaten exportieren“ und die Datei im Repository ersetzen. Schüler können dort Einträge mit einem Klick kopieren; Admin, Ampel und Notizen sind ausgeblendet.</p>
  ${KLASSEN.map(k=>`<div class="row"><span style="min-width:80px">${esc(k.id)}</span><input type="text" readonly style="flex:1;min-width:220px" value="${esc(studentLink(k.id))}"><button class="btn sm" data-act="copyLink" data-k="${esc(k.id)}">Link kopieren</button></div>`).join('')}</div>`;
 }
 return h;
}

function renderModal(){
 const m=document.getElementById('modal');
 if(!ui.modal){m.className='';m.innerHTML='';return;}
 const o=C.occById[ui.modal];if(!o){ui.modal=null;m.className='';return;}
 m.className='on';
 m.innerHTML=`<div class="box"><h2 style="margin-top:0">Klassenbuch- / Berichtsheft-Eintrag</h2><p class="small">${esc(o.klasse)} · ${esc(o.fach)} · ${TAGE[wd(o.date)]} ${de(o.date)} · ${esc(periodLabel(o.period))}</p>
 <textarea id="entryTxt" style="min-height:130px" ${STUDENT?'readonly':''}>${esc(entryText(o))}</textarea>
 <div class="acts" style="margin-top:10px"><button class="btn pri" data-act="mCopy">${ICON_COPY} In Zwischenablage kopieren</button><button class="btn" data-act="mCopyDate">Mit Datum kopieren</button>
 ${STUDENT?'':'<button class="btn" data-act="mSave">Eigenen Text speichern</button><button class="btn ghost" data-act="mReset">Vorschlag wiederherstellen</button>'}
 <button class="btn ghost" data-act="mClose">Schließen</button></div></div>`;
}
function renderFoot(){
 document.getElementById('foot').innerHTML=STUDENT?'':`<div class="card"><button class="btn pri" data-act="export">Planungsdaten exportieren</button><button class="btn pri" data-act="import">Planungsdaten importieren</button><button class="btn danger" data-act="reset">Alles zurücksetzen</button>
 <span class="small">Alle Änderungen werden automatisch im Browser (LocalStorage) gespeichert. Für Geräte-Wechsel und die Schüleransicht: <code>stundenplan_backup.json</code> exportieren und ins Repository legen.</span></div>`;
}
function fillExFach(){
 const k=document.getElementById('exK'),f=document.getElementById('exF');if(!k||!f)return;
 f.innerHTML=(FAECHER[typOf(k.value)]||[]).map(x=>`<option>${x}</option>`).join('');
}
function renderAll(){
 renderHeader();renderTabs();
 const a=document.getElementById('app');
 if(LOAD_ERR)a.innerHTML='<div class="warn">Die Datei <b>stundenplan_backup.json</b> konnte nicht geladen werden. Sie muss im Repository neben der index.html liegen.</div>';
 else a.innerHTML=ui.tab==='woche'?renderWoche():ui.tab==='status'?renderStatus():ui.tab==='verlauf'?renderVerlauf():renderAdmin();
 if(ui.tab==='admin'&&ui.adminSec==='klausur')fillExFach();
 renderFoot();renderModal();
}
function refresh(){compute();renderAll();}

/* ================= AKTIONEN ================= */
function toggleExam(o){
 const i=state.exams.findIndex(e=>e.date===o.date&&e.klasse===o.klasse&&e.fach===o.fach);
 if(i>=0)state.exams.splice(i,1);else state.exams.push({id:uid(),date:o.date,klasse:o.klasse,fach:o.fach,note:''});
 save();refresh();
}
function toggleAbsDay(d){
 const i=state.absences.findIndex(a=>a.from===d&&(a.to||a.from)===d);
 if(i>=0)state.absences.splice(i,1);
 else if(state.absences.some(a=>d>=a.from&&d<=(a.to||a.from))){toast('Dieser Tag gehört zu einem Zeitraum – bitte unter Admin ändern.',true);return;}
 else state.absences.push({id:uid(),from:d,to:d,note:''});
 save();refresh();
}
function gotoNext(label){let m=addDays(ui.week,7);for(let i=0;i<60;i++){if(abOf(m)===label)break;m=addDays(m,7);}ui.week=m;renderAll();}
const val=id=>(document.getElementById(id)||{}).value||'';

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id;
 switch(a){
  case 'tab':ui.tab=t.dataset.v;renderAll();break;
  case 'sec':ui.adminSec=t.dataset.v;renderAll();break;
  case 'wprev':ui.week=addDays(ui.week,-7);renderAll();break;
  case 'wnext':ui.week=addDays(ui.week,7);renderAll();break;
  case 'wtoday':{let d=todayStr();if(wd(d)>4)d=addDays(d,7);ui.week=mondayOf(d);renderAll();break;}
  case 'wnextA':gotoNext('A');break;
  case 'wnextB':gotoNext('B');break;
  case 'copy':{const o=C.occById[id];if(o)copyText(entryText(o));break;}
  case 'copyAll':{const c=C.chains[ui.chainKey],td=state.settings.stichtag||todayStr();const lines=c.occ.filter(o=>o.unit&&o.date<td).map(o=>`${de(o.date)}: ${entryText(o)}`);if(!lines.length)toast('Noch keine gehaltenen Stunden',true);else copyText(lines.join('\n\n'));break;}
  case 'entry':ui.modal=id;renderModal();break;
  case 'mClose':ui.modal=null;renderModal();break;
  case 'mCopy':copyText(val('entryTxt'));break;
  case 'mCopyDate':{const o=C.occById[ui.modal];if(o)copyText(`${de(o.date)} (${periodLabel(o.period)}), ${o.fach}: ${val('entryTxt')}`);break;}
  case 'mSave':{const o=C.occById[ui.modal];if(o&&o.unit){const v=val('entryTxt').trim();if(!v||v===autoText(o))delete state.texts[textKey(o)];else state.texts[textKey(o)]=v;save();toast('Text gespeichert');renderAll();}break;}
  case 'mReset':{const o=C.occById[ui.modal];if(o&&o.unit){delete state.texts[textKey(o)];save();renderAll();}break;}
  case 'exam':{const o=C.occById[id];if(o)toggleExam(o);break;}
  case 'absday':toggleAbsDay(t.dataset.d);break;
  case 'addAbs':{const f=val('absFrom');if(!f){toast('Bitte Startdatum wählen',true);break;}let to=val('absTo')||f;if(to<f)to=f;state.absences.push({id:uid(),from:f,to,note:val('absNote').trim()});save();refresh();break;}
  case 'delAbs':state.absences=state.absences.filter(x=>x.id!==id);save();refresh();break;
  case 'addExam':{const d=val('exDate');if(!d||!val('exF')){toast('Datum und Fach wählen',true);break;}state.exams.push({id:uid(),date:d,klasse:val('exK'),fach:val('exF'),note:val('exNote').trim()});save();refresh();break;}
  case 'delExam':state.exams=state.exams.filter(x=>x.id!==id);save();refresh();break;
  case 'addFree':{const d=val('frDate');if(!d){toast('Bitte Datum wählen',true);break;}state.customDays.push({id:uid(),date:d,name:val('frName').trim()||'Schulfrei'});save();refresh();break;}
  case 'delFree':state.customDays=state.customDays.filter(x=>x.id!==id);save();refresh();break;
  case 'addMod':{const ch=state.chains[t.dataset.key];ch.modules.push({id:uid(),nr:Math.max(0,...ch.modules.map(m=>+m.nr||0))+1,name:'Neues Modul',ds:4,on:true,link:'',inhalte:''});save();refresh();break;}
  case 'delMod':{if(confirm('Modul wirklich löschen?')){state.chains[t.dataset.key].modules.splice(+t.dataset.i,1);save();refresh();}break;}
  case 'copyChain':{const from=val('cpFrom'),to=ui.adminKlasse;if(from===to||typOf(from)!==typOf(to)){toast('Bitte eine andere Klasse desselben Typs wählen',true);break;}if(!confirm(`Stoffpläne von ${from} nach ${to} übernehmen? Bestehende Einstellungen von ${to} werden überschrieben.`))break;FAECHER[typOf(to)].forEach(f=>{state.chains[to+'|'+f]=JSON.parse(JSON.stringify(state.chains[from+'|'+f]));});save();refresh();toast('Übernommen');break;}
  case 'copyLink':copyText(studentLink(t.dataset.k));break;
  case 'export':{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='stundenplan_backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup heruntergeladen');break;}
  case 'import':document.getElementById('fileIn').click();break;
  case 'reset':if(confirm('Wirklich ALLE Planungsdaten löschen und neu beginnen?')){state=defaultState();save();refresh();toast('Zurückgesetzt');}break;
 }
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'){ui.modal=null;renderModal();}});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.bind){ /* generische Datenbindung (Admin-Felder) */
  const p=t.dataset.bind.split('.');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];
  const last=p[p.length-1];
  if(last==='ds'&&o.check)o.check=false;
  o[last]=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?Math.max(1,parseInt(t.value)||1):t.value;
  save();compute();renderHeader();return;
 }
 const cell=t.closest('[data-slot]');
 if(cell){
  const k=cell.dataset.slot,kl=cell.querySelector('[data-role=k]').value;
  if(!kl)delete state.slots[k];
  else{const fs=FAECHER[typOf(kl)];let f=cell.querySelector('[data-role=f]').value;if(t.dataset.role==='k'||!fs.includes(f))f=fs[0];state.slots[k]={klasse:kl,fach:f};}
  save();refresh();return;
 }
 if(t.dataset.role==='exK'){fillExFach();return;}
 if(t.dataset.ui){
  const k=t.dataset.ui;
  if(k==='weekDate'){if(t.value)ui.week=mondayOf(t.value);}
  else ui[k]=t.value;
  renderAll();
 }
});
document.getElementById('fileIn').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const j=JSON.parse(await f.text());
  if(!j||typeof j!=='object'||!j.settings||!j.chains)throw new Error('format');
  if(!confirm('Aktuelle Planungsdaten durch das Backup ersetzen?')){e.target.value='';return;}
  state=normalize(j);save();refresh();toast('Import erfolgreich');
 }catch(err){toast('Die Datei ist kein gültiges Backup',true);}
 e.target.value='';
});

/* ================= START ================= */
async function init(){
 const q=new URLSearchParams(location.search);
 STUDENT=q.get('mode')==='schueler';
 const fetchJson=async()=>{const r=await fetch('stundenplan_backup.json',{cache:'no-store'});if(!r.ok)throw new Error('http');return normalize(await r.json());};
 if(STUDENT){
  try{state=await fetchJson();}catch(e){state=defaultState();LOAD_ERR=true;}
  ui.filterKlasse=KLASSEN.some(k=>k.id===q.get('klasse'))?q.get('klasse'):'';
  document.getElementById('title').textContent='Stundenplan – Schüleransicht';
 }else{
  state=loadLocal();
  if(!state){try{state=await fetchJson();save();}catch(e){state=defaultState();}}
 }
 let d=todayStr();if(wd(d)>4)d=addDays(d,7);
 ui.week=mondayOf(d);
 refresh();
}
init();
</script>
