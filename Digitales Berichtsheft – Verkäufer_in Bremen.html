<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digitales Berichtsheft – Verkäufer/in Bremen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface2:#eef2f7; --text:#1a2230; --muted:#5a6578;
    --border:#cfd7e3; --primary:#1d4ed8; --primary-text:#ffffff; --ok:#15803d; --warn:#b45309;
    --focus:#f59e0b; --ai-bg:#fff7e6; --ai-border:#f0c36d;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141b; --surface:#18202b; --surface2:#212b39; --text:#e8edf4; --muted:#9aa6b8;
      --border:#33404f; --primary:#6ea0ff; --primary-text:#0b1220; --ok:#4ade80; --warn:#fbbf24;
      --focus:#fbbf24; --ai-bg:#2a2314; --ai-border:#6b5320;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f141b; --surface:#18202b; --surface2:#212b39; --text:#e8edf4; --muted:#9aa6b8;
    --border:#33404f; --primary:#6ea0ff; --primary-text:#0b1220; --ok:#4ade80; --warn:#fbbf24;
    --focus:#fbbf24; --ai-bg:#2a2314; --ai-border:#6b5320;
    color-scheme: dark;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans','Noto Sans Arabic','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    line-height:1.5; font-size:16px;
  }
  .wrap{ max-width:860px; margin:0 auto; padding:16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
  h1{ font-size:1.5rem; margin:0; line-height:1.2; }
  h2{ font-size:1.1rem; margin:0 0 10px; }
  label,.lbl{ display:block; font-weight:600; margin-bottom:6px; }
  input[type=text],input[type=date],select,textarea{
    width:100%; border:1.5px solid var(--border); border-radius:10px; background:var(--surface);
    color:var(--text); padding:10px 12px; font:inherit; min-height:44px;
  }
  textarea{ min-height:96px; resize:vertical; }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px;
    padding:8px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface2);
    color:var(--text); font:inherit; font-weight:600; cursor:pointer; text-align:center;
  }
  .btn:hover{ border-color:var(--primary); }
  .btn-primary{ background:var(--primary); color:var(--primary-text); border-color:var(--primary); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-lang[aria-pressed="true"]{ background:var(--primary); color:var(--primary-text); border-color:var(--primary); }
  .btn-lang{ min-height:40px; padding:6px 12px; }
  .chip{ text-align:start; font-weight:500; font-size:.92rem; min-height:40px; padding:6px 10px; justify-content:flex-start; }
  .muted{ color:var(--muted); font-size:.92rem; }
  .info{ background:var(--surface2); border-radius:10px; padding:10px 12px; }
  .info b{ display:block; font-size:.85rem; color:var(--muted); font-weight:600; }
  .info output{ font-weight:700; font-size:1.05rem; }
  .aibox{ background:var(--ai-bg); border:1.5px dashed var(--ai-border); border-radius:12px; padding:12px; }
  .aibox textarea{ min-height:120px; font-size:.9rem; background:transparent; }
  .day-title{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .done{ color:var(--ok); font-weight:700; }
  .warn{ color:var(--warn); font-weight:600; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">

  <header class="card">
    <h1 data-i18n="title">Digitales Berichtsheft</h1>
    <p class="muted" style="margin:4px 0 0">Verkäufer/in · HK Bremen · 2026/2027</p>
    <div class="mt-3">
      <span class="lbl" data-i18n="lang">Sprache</span>
      <div id="langs" class="flex flex-wrap gap-2" role="group" data-i18n-aria="lang"></div>
    </div>
  </header>

  <section class="card" aria-labelledby="h-base">
    <h2 id="h-base" data-i18n="name">Vor- und Nachname</h2>
    <div class="grid gap-3 md:grid-cols-2">
      <div>
        <label for="name" data-i18n="name">Vor- und Nachname</label>
        <input id="name" type="text" autocomplete="name">
      </div>
      <div>
        <label for="date" data-i18n="date">Datum in der Woche wählen</label>
        <input id="date" type="date" min="2026-08-01" max="2027-07-31">
      </div>
    </div>
    <div class="grid gap-3 mt-3 md:grid-cols-2" aria-live="polite">
      <div class="info"><b data-i18n="kw">Kalenderwoche</b><output id="kw">–</output></div>
      <div class="info"><b data-i18n="period">Zeitraum</b><output id="period">–</output></div>
    </div>
    <p id="dateWarn" class="warn mt-2" hidden></p>
  </section>

  <section class="card" aria-labelledby="h-untis">
    <h2 id="h-untis" data-i18n="untisTitle">Lerninhalte der Berufsschule (aus Untis einfügen)</h2>
    <p class="muted" style="margin:0 0 8px" data-i18n="untisHint"></p>
    <label for="untis" class="sr" data-i18n="untisTitle"></label>
    <textarea id="untis" style="min-height:130px"></textarea>
    <div class="grid gap-3 mt-3 md:grid-cols-2 items-end">
      <div>
        <label for="target" data-i18n="targetDay">Ziel-Wochentag</label>
        <select id="target"></select>
      </div>
      <button type="button" class="btn btn-primary" data-act="untis" data-i18n="copyToDay">In Ziel-Wochentag kopieren</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-branch">
    <h2 id="h-branch" data-i18n="branch">Meine Branche</h2>
    <label for="branch" class="sr" data-i18n="branch"></label>
    <select id="branch"></select>
  </section>

  <div id="days"></div>

  <section class="card" aria-labelledby="h-extra">
    <h2 id="h-extra" data-i18n="extra">Ergänzende Einträge für die Berufsschule (Klausuren/Notizen)</h2>
    <label for="extra" class="sr" data-i18n="extra"></label>
    <textarea id="extra"></textarea>
  </section>

  <section class="card">
    <p id="status" class="muted" role="status" aria-live="polite" style="margin:0 0 12px"></p>
    <div class="flex flex-wrap gap-3 items-center">
      <button id="pdfBtn" type="button" class="btn btn-primary" disabled data-i18n="pdf">PDF herunterladen</button>
      <button id="resetBtn" type="button" class="btn" data-i18n="reset">Alles zurücksetzen</button>
    </div>
    <p class="muted" style="margin:12px 0 0" data-i18n="saveNote"></p>
  </section>

</div>

  'Kontrolle des Mindesthaltbarkeitsdatums (MHD), insbesondere bei Molkereiprodukten.',
  'Einhalten der Kühlkette und der HACCP-Richtlinien, Dokumentation der Temperaturkontrolle.',
  'Platzierung saisonaler Aktionsware am Point of Sale (POS).',
  'Durchführung des Hygieneplans und Betreuung des Pfandautomaten.'],
 'Textil':[
  'Gestaltung und Pflege von Warenpräsentation und Schaufenster (Visual Merchandising).',
  'Auszeichnung nach Konfektionsgrößen und Anbringen von Sicherungsetiketten.',
  'Bedarfsanalyse und Zusatzverkauf (Cross-Selling) im Kundengespräch.',
  'Räumen der Umkleidekabinen und Zurückführen der Ware auf die Verkaufsfläche.',
  'Bearbeitung von Reklamationen unter Beachtung der Gewährleistung.'],
 'Drogerie':[
  'Umgang mit Gefahrstoffen unter Beachtung der Sicherheitsdatenblätter.',
  'Spiegeln der Ware im Kosmetikbereich und Kontrolle der Tester.',
  'Anbringen von Warenschutzetiketten, insbesondere bei Düften.',
  'Beratung zu freiverkäuflichen Arzneimitteln unter Beachtung der gesetzlichen Vorgaben.',
  'Austausch und Kontrolle der Aktionspreisschilder.'],
 'Elektro':[
  'Bearbeitung eines Garantiefalls und Erstellen eines Reparaturauftrags.',
  'Beratung zu Unterhaltungselektronik und Garantieverlängerung.',
  'Anbringen von Leinensicherungen an Smartphones und Vorführgeräten.',
  'Platzierung von Zubehör zur Förderung von Spontankäufen.',
  'Retourenprüfung: Kontrolle zurückgegebener Ware auf Vollständigkeit und Funktion.'],
 'Pflanzen':[
  'Pflege der Pflanzen im Gartencenter (Gießen, Entfernen welker Pflanzenteile).',
  'Botanische Auszeichnung der Pflanzen mit Pflanzenschildern.',
  'Transportsicherung von Großkeramik und Unterstützung der Kunden beim Verladen.',
  'Kontrolle auf Schädlingsbefall und Aussortieren befallener Ware (Abschreibungen).',
  'Verräumen schwerer Erden unter Beachtung der Unfallverhütung (rückenschonendes Heben).']
};
var TXT_SICK   = 'Betriebliche Freistellung wegen Krankheit / Arbeitsunfähigkeit.';
var TXT_VAC    = 'Keine gesetzliche/betriebliche Ausbildung wegen Erholungsurlaub.';
var TXT_SCHOOL = 'Theoretische Ausbildung in der Berufsschule laut Stundenplan.';
var PROMPT = "Formuliere folgenden Text in stichpunktartiges, professionelles IHK-Berichtsheft-Deutsch (Nominalstil, z.B. 'Verräumen der Ware' statt 'Ich habe Ware verräumt') für den Beruf Verkäufer um: [TEXT]";
var DAYS_DE = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];

/* ---------- Zustand ---------- */
var KEY = 'berichtsheft-bremen-2026-27';
function freshState(){
  return {lang:'de', name:'', date:'', branch:'', target:0, untis:'', extra:'',
          days:[0,1,2,3,4].map(function(){return {note:'', final:''};})};
}
var S = freshState();
var week = null;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw), f = freshState();
      Object.keys(f).forEach(function(k){ if(o[k] !== undefined) f[k] = o[k]; });
      if(!Array.isArray(f.days) || f.days.length !== 5) f.days = freshState().days;
      S = f;
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Helfer ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function t(k){ var o = T[k]; return o ? (o[S.lang] || o.de) : k; }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(d){ return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+'.'+d.getUTCFullYear(); }

/* ISO-8601-Kalenderwoche */
function computeWeek(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  var p = iso.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
  if(isNaN(d.getTime())) return null;
  var dow = d.getUTCDay() || 7;
  var monday = new Date(d); monday.setUTCDate(d.getUTCDate() - (dow - 1));
  var thu = new Date(d); thu.setUTCDate(d.getUTCDate() + (4 - dow));
  var yStart = new Date(Date.UTC(thu.getUTCFullYear(), 0, 1));
  var kw = Math.ceil(((thu - yStart) / 86400000 + 1) / 7);
  var dates = [0,1,2,3,4].map(function(i){ var x = new Date(monday); x.setUTCDate(monday.getUTCDate()+i); return x; });
  var inYear = iso >= '2026-08-01' && iso <= '2027-07-31';
  return {kw:kw, isoYear:thu.getUTCFullYear(), monday:dates[0], friday:dates[4], dates:dates, inYear:inYear};
}

/* ---------- Aufbau ---------- */
function buildStatic(){
  var lg = $('#langs');
  Object.keys(LANGS).forEach(function(code){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-lang'; b.textContent = LANGS[code];
    b.setAttribute('lang', code); b.dataset.lang = code;
    lg.appendChild(b);
  });
  var tg = $('#target');
  for(var i=0;i<5;i++){
    var o = document.createElement('option'); o.value = i; o.setAttribute('data-i18n','d'+(i+1)); tg.appendChild(o);
  }
  var br = $('#branch');
  var o0 = document.createElement('option'); o0.value = ''; o0.setAttribute('data-i18n','branchPick'); br.appendChild(o0);
  Object.keys(PHRASES).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = k; br.appendChild(o);
  });
}

function buildCards(){
  var wrap = $('#days'); wrap.innerHTML = '';
  for(var i=0;i<5;i++){
    var sec = document.createElement('section');
    sec.className = 'card'; sec.setAttribute('aria-labelledby','h'+i);
    sec.innerHTML =
      '<div class="day-title mb-3">'+
        '<h2 id="h'+i+'" style="margin:0"><span data-i18n="d'+(i+1)+'"></span><span id="dt'+i+'" class="muted"></span></h2>'+
        '<span id="st'+i+'" class="done" aria-hidden="true"></span>'+
      '</div>'+
      '<label for="note'+i+'" data-i18n="learned"></label>'+
      '<textarea id="note'+i+'" data-field="note" data-day="'+i+'"></textarea>'+
      '<button type="button" class="btn btn-primary mt-2 w-full md:w-auto" data-act="translate" data-day="'+i+'" data-i18n="translateBtn"></button>'+
      '<div class="mt-4">'+
        '<label for="final'+i+'" data-i18n="final"></label>'+
        '<textarea id="final'+i+'" data-field="final" data-day="'+i+'" lang="de"></textarea>'+
        '<div class="flex flex-wrap gap-2 mt-2">'+
          '<button type="button" class="btn" data-act="sick" data-day="'+i+'" data-i18n="qSick"></button>'+
          '<button type="button" class="btn" data-act="vac" data-day="'+i+'" data-i18n="qVac"></button>'+
          '<button type="button" class="btn" data-act="school" data-day="'+i+'" data-i18n="qSchool"></button>'+
        '</div>'+
      '</div>'+
      '<div id="ph'+i+'" class="mt-4" hidden>'+
        '<span class="lbl" data-i18n="phrases"></span>'+
        '<div id="phb'+i+'" class="grid gap-2"></div>'+
      '</div>'+
      '<div class="aibox mt-4">'+
        '<label for="ai'+i+'" data-i18n="aiTitle"></label>'+
        '<p class="muted" style="margin:0 0 8px" data-i18n="aiHint"></p>'+
        '<textarea id="ai'+i+'" readonly dir="ltr" lang="de"></textarea>'+
        '<button type="button" class="btn mt-2" data-act="copyai" data-day="'+i+'" data-i18n="copy"></button>'+
      '</div>';
    wrap.appendChild(sec);
    $('#note'+i).value = S.days[i].note;
    $('#final'+i).value = S.days[i].final;
    updateAi(i);
  }
}

function renderPhrases(){
  var list = PHRASES[S.branch];
  for(var i=0;i<5;i++){
    var box = $('#ph'+i), cont = $('#phb'+i);
    cont.innerHTML = '';
    if(!list){ box.hidden = true; continue; }
    box.hidden = false;
    list.forEach(function(txt, idx){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn chip'; b.textContent = txt; b.lang = 'de';
      b.dataset.act = 'phrase'; b.dataset.day = i; b.dataset.idx = idx;
      cont.appendChild(b);
    });
  }
}

/* ---------- Sprache ---------- */
function applyLang(){
  var l = S.lang;
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  document.title = t('title') + ' – Verkäufer/in Bremen';
  $$('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  $$('.btn-lang').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false'); });
  $('#target').value = String(S.target);
  updateWeek();
  validate();
}

/* ---------- Woche ---------- */
function updateWeek(){
  week = computeWeek(S.date);
  var warn = $('#dateWarn');
  if(week){
    $('#kw').textContent = 'KW ' + week.kw + ' / ' + week.isoYear;
    $('#period').textContent = fmt(week.monday) + ' – ' + fmt(week.friday);
    for(var i=0;i<5;i++) $('#dt'+i).textContent = ' · ' + fmt(week.dates[i]);
    if(!week.inYear){ warn.hidden = false; warn.textContent = t('outOfYear'); } else warn.hidden = true;
  } else {
    $('#kw').textContent = '–'; $('#period').textContent = '–';
    for(var j=0;j<5;j++) $('#dt'+j).textContent = '';
    warn.hidden = true;
  }
}

/* ---------- Texte setzen ---------- */
function setFinal(i, val){
  S.days[i].final = val;
  $('#final'+i).value = val;
  save(); validate();
}
function appendFinal(i, txt){
  var cur = S.days[i].final.replace(/\s+$/,'');
  setFinal(i, cur ? cur + '\n' + txt : txt);
}
function updateAi(i){
  var n = S.days[i].note.trim();
  $('#ai'+i).value = PROMPT.replace('[TEXT]', n || '[TEXT]');
}

/* ---------- Validierung ---------- */
function validate(){
  var miss = [];
  if(!S.name.trim()) miss.push(t('missName'));
  if(!week || !week.inYear) miss.push(t('missWeek'));
  for(var i=0;i<5;i++){
    var ok = S.days[i].final.trim().length > 0;
    $('#st'+i).textContent = ok ? '✓' : '';
    if(!ok) miss.push(t('d'+(i+1)));
  }
  var btn = $('#pdfBtn'), st = $('#status');
  if(!miss.length){ btn.disabled = false; st.textContent = t('ready'); }
  else { btn.disabled = true; st.textContent = t('open') + ' ' + miss.join(', '); }
}

/* ---------- Zwischenablage ---------- */
function copyText(text, btn){
  function done(){
    var old = btn.textContent; btn.textContent = t('copied');
    setTimeout(function(){ btn.textContent = old; }, 1400);
  }
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}

/* ---------- Aktionen ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-lang]'); if(!el) return;
  if(el.dataset.lang){ S.lang = el.dataset.lang; save(); applyLang(); return; }
  var act = el.dataset.act, i = parseInt(el.dataset.day, 10);
  if(act === 'translate'){
    var txt = S.days[i].note.trim();
    if(!txt){ $('#note'+i).focus(); return; }
    window.open('https://translate.google.com/?sl=auto&tl=de&op=translate&text=' + encodeURIComponent(txt), '_blank', 'noopener');
  } else if(act === 'sick'){ setFinal(i, TXT_SICK); }
  else if(act === 'vac'){ setFinal(i, TXT_VAC); }
  else if(act === 'school'){
    var u = S.untis.trim();
    setFinal(i, u ? TXT_SCHOOL + '\n' + u : TXT_SCHOOL);
  }
  else if(act === 'phrase'){ appendFinal(i, PHRASES[S.branch][parseInt(el.dataset.idx,10)]); }
  else if(act === 'copyai'){ copyText($('#ai'+i).value, el); }
  else if(act === 'untis'){
    var u2 = S.untis.trim();
    if(!u2){ $('#untis').focus(); return; }
    appendFinal(S.target, u2);
    $('#final'+S.target).scrollIntoView({behavior:'smooth', block:'center'});
  }
});

document.addEventListener('input', function(ev){
  var el = ev.target;
  if(el.dataset && el.dataset.field){
    var i = parseInt(el.dataset.day, 10);
    S.days[i][el.dataset.field] = el.value;
    if(el.dataset.field === 'note') updateAi(i);
    save(); validate();
  }
});
$('#name').addEventListener('input', function(e){ S.name = e.target.value; save(); validate(); });
$('#date').addEventListener('change', function(e){ S.date = e.target.value; save(); updateWeek(); validate(); });
$('#untis').addEventListener('input', function(e){ S.untis = e.target.value; save(); });
$('#extra').addEventListener('input', function(e){ S.extra = e.target.value; save(); });
$('#target').addEventListener('change', function(e){ S.target = parseInt(e.target.value, 10) || 0; save(); });
$('#branch').addEventListener('change', function(e){ S.branch = e.target.value; save(); renderPhrases(); });
$('#resetBtn').addEventListener('click', function(){
  if(!window.confirm(t('confirmReset'))) return;
  var lang = S.lang;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = freshState(); S.lang = lang;
  fillFields(); buildCards(); applyLang(); renderPhrases(); save();
});

/* ---------- PDF ---------- */
function pdfSafe(s){
  return String(s || '')
    .replace(/[“”„]/g,'"').replace(/[‘’‚]/g,"'").replace(/[–—]/g,'-').replace(/[•·]/g,'-').replace(/€/g,'EUR')
    .replace(/\r/g,'').replace(/\t/g,' ')
    .normalize('NFC')
    .replace(/[^\n\x20-\x7E\u00A0-\u00FF]/g, function(c){
      var b = c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      return /^[\x20-\x7E\u00A0-\u00FF]*$/.test(b) ? b : '';
    });
}

function makePdf(){
  if(!window.jspdf){ window.alert('PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.'); return; }
  var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  var M = 15, W = 180, C1 = 38, LH = 4.4, BOTTOM = 282, PH = 297;
  var y = 0;
  doc.setLineHeightFactor(1.3);
  doc.setLineWidth(0.3);

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Ausbildungsnachweis (Berichtsheft) - Wochenbericht', M, 18);

  var rows = [
    ['Name:', S.name.trim()],
    ['Ausbildungsberuf:', 'Verkäufer/in'],
    ['Zuständige Stelle:', 'Handelskammer Bremen - IHK für Bremen und Bremerhaven'],
    ['Kalenderwoche:', 'KW ' + week.kw + ' / ' + week.isoYear],
    ['Zeitraum:', fmt(week.monday) + ' - ' + fmt(week.friday) + ' (Montag bis Freitag)']
  ];
  doc.rect(M, 24, W, 33);
  doc.setFontSize(10);
  rows.forEach(function(r, k){
    var yy = 31 + k*6;
    doc.setFont('helvetica','bold'); doc.text(pdfSafe(r[0]), M+3, yy);
    doc.setFont('helvetica','normal'); doc.text(pdfSafe(r[1]), M+42, yy);
  });
  y = 63;

  function head(){
    doc.setFillColor(225,229,235);
    doc.rect(M, y, C1, 8, 'FD'); doc.rect(M+C1, y, W-C1, 8, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Tag / Datum', M+2, y+5.5);
    doc.text('Ausgeführte Tätigkeiten / Unterricht', M+C1+2, y+5.5);
    y += 8;
  }
  function newPage(){ doc.addPage(); y = 15; head(); }
  head();

  for(var i=0;i<5;i++){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    var lines = doc.splitTextToSize(pdfSafe(S.days[i].final.trim()), W - C1 - 4);
    var idx = 0, first = true;
    while(idx < lines.length || first){
      var maxLines = Math.floor((BOTTOM - y - 4) / LH);
      if(maxLines < 2){ newPage(); continue; }
      var chunk = lines.slice(idx, idx + maxLines);
      var h = Math.max(first ? 14 : 6, chunk.length * LH + 4);
      doc.rect(M, y, C1, h); doc.rect(M+C1, y, W-C1, h);
      if(first){
        doc.setFont('helvetica','bold'); doc.setFontSize(10);
        doc.text(DAYS_DE[i], M+2, y+5.5);
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        doc.text(fmt(week.dates[i]), M+2, y+10.5);
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      doc.text(chunk, M+C1+2, y+5);
      idx += chunk.length; y += h; first = false;
      if(idx < lines.length) newPage();
    }
  }

  var extra = S.extra.trim();
  if(extra){
    y += 8;
    if(y > BOTTOM - 20){ doc.addPage(); y = 15; }
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Ergänzende Einträge für die Berufsschule (Klausuren/Notizen)', M, y);
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.splitTextToSize(pdfSafe(extra), W).forEach(function(ln){
      if(y > BOTTOM - 4){ doc.addPage(); y = 15; }
      doc.text(ln, M, y); y += LH;
    });
  }

  if(y > 235){ doc.addPage(); y = 15; }
  var sy = 266;
  var labels = ['Auszubildende/r','Ausbilder/in','Gesetzliche/r Vertreter/in'];
  for(var s=0;s<3;s++){
    var x = M + s*62.5;
    doc.line(x, sy, x+55, sy);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('Datum, Unterschrift', x, sy+4);
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text(labels[s], x, sy+8.5);
  }

  var n = doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('Seite ' + p + ' von ' + n, M+W, PH-8, {align:'right'});
  }

  var safeName = pdfSafe(S.name.trim()).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'Berichtsheft';
  doc.save('Berichtsheft_KW' + week.kw + '_' + week.isoYear + '_' + safeName + '.pdf');
}
$('#pdfBtn').addEventListener('click', function(){ if(!this.disabled) makePdf(); });

/* ---------- Start ---------- */
function fillFields(){
  $('#name').value = S.name; $('#date').value = S.date;
  $('#untis').value = S.untis; $('#extra').value = S.extra;
  $('#branch').value = S.branch; $('#target').value = String(S.target);
}
load();
buildStatic();
fillFields();
buildCards();
renderPhrases();
applyLang();
})();
</script>
