<style>
:root{
  --ink:#17233F; --bg:#E8EEF5; --paper:#FFFFFF; --rule:#BCD2EA; --margin:#CF3F36;
  --accent:#1F5FBF; --ok:#1B7F4B; --muted:#55627A; --line:#C5D0DE; --marker:#FFF3B8; --markerLine:#D9B600;
}
html{background:var(--bg);}
body{margin:0;color:var(--ink);background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",Nyala,Arial,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:96px;}
a{color:var(--accent);}
.wrap{max-width:48rem;margin-inline:auto;padding-inline:1rem;}
.title{font-size:2rem;font-weight:800;letter-spacing:-.01em;margin:0;}
.muted{color:var(--muted);}
.card{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--margin);
  border-radius:6px;padding:1rem 1rem 1.1rem;margin-block:1rem;}
.card-title,.card h2{font-size:1.15rem;font-weight:700;margin:0 0 .6rem;}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem;}
.card-head h2{margin:0;}
.date{font-weight:500;color:var(--muted);font-size:.95rem;}
.opt{font-weight:400;color:var(--muted);font-size:.85rem;}
.badge{color:var(--ok);font-weight:800;font-size:1.2rem;min-width:1.2rem;text-align:center;}
label,.lbl{display:block;font-weight:600;font-size:.92rem;margin:.7rem 0 .25rem;}
input[type=text],input[type=date],select,textarea{
  width:100%;box-sizing:border-box;border:1px solid #8E9BB0;border-radius:5px;background:#fff;color:var(--ink);
  padding:.55rem .65rem;font:inherit;min-height:44px;}
select{appearance:auto;}
textarea{display:block;resize:vertical;}
textarea.lined{
  line-height:28px;padding:0 .75rem;min-height:84px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-attachment:local;background-color:#fff;}
.hours{width:6rem;}
input.hours{text-align:center;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.5rem .9rem;border-radius:6px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:center;}
.btn:hover{background:#EEF3FA;}
.btn.primary{background:var(--ink);color:#fff;}
.btn.primary:hover{background:#26365C;}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.blue:hover{background:#18499A;}
.btn.small{min-height:40px;padding:.35rem .7rem;font-size:.92rem;}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:#E4E8EF;color:#4A5568;border-color:#9AA6B8;}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem;}
.lang{min-height:44px;padding:.35rem .8rem;border:2px solid var(--ink);border-radius:999px;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);}
.lang[aria-pressed=true]{background:var(--ink);color:#fff;}
.ai{background:var(--marker);border:2px solid var(--markerLine);border-radius:6px;padding:.7rem .8rem;}
.ai-title{font-weight:800;margin:0 0 .3rem;}
.ai-text{margin:0 0 .6rem;font-size:.9rem;word-break:break-word;}
.weekbox{margin-top:.8rem;padding:.6rem .8rem;border:1px dashed #8E9BB0;border-radius:6px;background:#F5F8FC;min-height:2.6rem;}
.warn{color:#9A3B00;font-weight:600;}
.bar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom,0px));z-index:20;}
.bar-in{max-width:48rem;margin-inline:auto;padding-inline:1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
#barstatus{font-weight:600;font-size:.95rem;}
#missingList{margin:.3rem 0 0;padding-inline-start:1.3rem;}
#toast{position:fixed;inset-inline:0;bottom:84px;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;
  padding:.5rem 1rem;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;}
#toast.on{opacity:1;}
dialog#sheet{width:min(42rem,calc(100% - 1rem));max-height:88vh;padding:0;border:2px solid var(--ink);border-radius:10px;color:var(--ink);}
dialog#sheet::backdrop{background:rgba(23,35,63,.55);}
.sheet-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);z-index:1;}
.sheet-head h2{margin:0;font-size:1.05rem;}
.sheet-body{padding:.5rem 1rem 1.2rem;}
details.cat{border:1px solid var(--line);border-radius:6px;margin-top:.6rem;background:#fff;}
details.cat summary{cursor:pointer;padding:.7rem .8rem;font-weight:700;min-height:44px;box-sizing:border-box;}
.plist{display:flex;flex-direction:column;gap:.4rem;padding:.2rem .6rem .7rem;}
.phrase{text-align:left;border:1px solid #8E9BB0;border-radius:6px;background:#F5F8FC;padding:.55rem .7rem;font:inherit;cursor:pointer;color:var(--ink);min-height:44px;}
.phrase:hover{background:#E4EDF9;}
.prow{display:flex;gap:.4rem;align-items:stretch;}
.prow .phrase{flex:1;}
.trbtn{min-width:44px;padding:.2rem;}
.ct{display:block;font-weight:500;font-size:.88rem;color:var(--muted);}
.phrase.done{background:#DDF3E6;border-color:var(--ok);}
.hint{background:#F5F8FC;border:1px dashed #8E9BB0;border-radius:6px;padding:.6rem .8rem;margin:.6rem 0 0;}
.small-note{font-size:.88rem;color:var(--muted);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

function load(){
  try{

      var p = JSON.parse(raw);
      state = Object.assign(defaultState(), p);
      if(!Array.isArray(state.days) || state.days.length !== 7){ state.days = defaultState().days; }
      state.days = state.days.map(function(d){ return Object.assign(emptyDay(), d); });

    var n = new Date();
    var iso = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
    if(iso >= SCHOOLYEAR.start && iso <= SCHOOLYEAR.end){ state.date = iso; }

function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function t(k,v){
  var s = (I18N[state.lang] && I18N[state.lang][k]) || I18N.de[k] || k;
  if(v){ Object.keys(v).forEach(function(x){ s = s.split('{'+x+'}').join(v[x]); }); }
  return s;
}
function dayName(i){ return (DAYS[state.lang]||DAYS.de)[i]; }
function pad(n){ return String(n).padStart(2,'0'); }
function parseISO(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m? new Date(Date.UTC(+m[1],+m[2]-1,+m[3])) : null; }
function addDays(d,n){ return new Date(d.getTime()+n*864e5); }
function fmt(d){ return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+'.'+d.getUTCFullYear(); }
function fmtShort(d){ return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+'.'; }
function toISO(d){ return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }

// ISO-8601: Woche beginnt am Montag, Woche 1 enthält den ersten Donnerstag des Jahres
function isoWeek(date){
  var d = new Date(date.getTime());
  var dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  var isoYear = d.getUTCFullYear();
  var thu = new Date(Date.UTC(isoYear,0,4));
  thu.setUTCDate(thu.getUTCDate()-((thu.getUTCDay()+6)%7)+3);
  return {week:1+Math.round((d-thu)/(7*864e5)), year:isoYear};
}
function weekInfo(){
  var d = parseISO(state.date);
  if(!d) return null;
  var mon = addDays(d,-((d.getUTCDay()+6)%7));
  var w = isoWeek(d);
  return {mon:mon, fri:addDays(mon,4), sun:addDays(mon,6), week:w.week, year:w.year};
}
function branchLabel(k){ var b=BRANCHES.filter(function(x){return x[0]===k;})[0]; return b?b[1]:''; }
function phraseList(ci){
  var b = state.branch, base = PH.allgemein[ci];
  return (b && b!=='allgemein' && PH[b]) ? PH[b][ci].concat(base) : base.slice();
}
function toast(msg){
  var el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('on');},1800);
}
function copyText(s){
  function fb(){
    var ta=document.createElement('textarea'); ta.value=s; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){} ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(s).catch(fb); }
  fb(); return Promise.resolve();
}

/* Klassenlink: ?land=NI&jahr=1&branche=textil&lang=ar&bereich=...&name=... ; ?lehrer zeigt den Link-Generator */
var TEACHER = false;
function applyParams(){
  var q; try{ q = new URLSearchParams(window.location.search); }catch(e){ return; }
  var changed = false, keys = ['lang','land','jahr','branche','bereich','name'];
  var land = (q.get('land')||'').toLowerCase();
  if(land==='hb' || land==='bremen'){ state.land='HB'; changed=true; }
  if(land==='ni' || land==='niedersachsen'){ state.land='NI'; changed=true; }
  var lg = (q.get('lang')||'').toLowerCase();
  if(LANGS.some(function(l){return l[0]===lg;})){ state.lang=lg; changed=true; }
  var j = q.get('jahr'); if(j==='1'||j==='2'||j==='3'){ state.year=j; changed=true; }
  var b = (q.get('branche')||'').toLowerCase();
  if(BRANCHES.some(function(x){return x[0]===b;})){
    var prev = branchLabel(state.branch); state.branch=b; changed=true;
    if(!state.area.trim() || state.area===prev){ state.area = branchLabel(b); }
  }
  if(q.get('bereich')){ state.area = q.get('bereich').slice(0,60); changed=true; }
  if(q.get('name')){ state.name = q.get('name').slice(0,60); changed=true; }
  TEACHER = q.has('lehrer');
  if(changed){
    save();
    try{ window.history.replaceState(null,'',window.location.pathname+(TEACHER?'?lehrer':'')+window.location.hash); }catch(e){}
  }
}

  if(!state.year) m.push(t('mYear'));
  if(NONLATIN.test(state.area)) m.push(t('mChars',{d:t('area')}));
  if(!weekInfo()) m.push(t('mDate'));
  for(var i=0;i<5;i++){
    var tx = state.days[i].text.trim();
    if(!tx) m.push(t('mDay',{d:dayName(i)}));
    else if(NONLATIN.test(tx)) m.push(t('mChars',{d:dayName(i)}));
  }
  for(var j=5;j<7;j++){ if(NONLATIN.test(state.days[j].text)) m.push(t('mChars',{d:dayName(j)})); }
  if(NONLATIN.test(state.instr)) m.push(t('mChars',{d:t('instr')}));
  if(NONLATIN.test(state.school)) m.push(t('mChars',{d:t('schoolLbl')}));
  return m;
}
function refresh(){
  var info = weekInfo(), box = $('#weekinfo');
  if(box){
    if(info){
      var out = (state.date < SCHOOLYEAR.start || state.date > SCHOOLYEAR.end);
      box.innerHTML = '<strong>'+esc(t('kw'))+' '+info.week+'</strong>: '+esc(t('from'))+' '+fmt(info.mon)+' '+esc(t('to'))+' '+fmt(info.sun)+
        (out?'<br><span class="warn">'+esc(t('outOfYear'))+'</span>':'');
    } else { box.textContent = ''; }
  }
  document.querySelectorAll('[data-daydate]').forEach(function(el){
    var i = +el.dataset.daydate; el.textContent = info ? '('+fmtShort(addDays(info.mon,i))+')' : '';
  });
  document.querySelectorAll('[data-badge]').forEach(function(el){
    el.textContent = state.days[+el.dataset.badge].text.trim() ? '✓' : '';
  });
  var total = state.days.reduce(function(a,d){return a+parseHours(d.hours);},0)+parseHours(state.instrHours)+parseHours(state.schoolHours);
  var sh = $('#sumHours'); if(sh) sh.textContent = fmtHours(total);
  var miss = missingList();
  var mc = $('#missingContent');
  if(mc){
    mc.innerHTML = miss.length
      ? '<strong>'+esc(t('missing'))+'</strong><ul id="missingList">'+miss.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'
      : '<strong style="color:var(--ok)">✓ '+esc(t('ready'))+'</strong>';
  }
  var bs = $('#barstatus');
  if(bs){ bs.textContent = miss.length ? t('missing')+' '+miss.length : '✓ '+t('ready'); bs.style.color = miss.length ? '' : 'var(--ok)'; }
  var pb = $('#pdfbtn'); if(pb) pb.disabled = miss.length>0;
}

/* =====================================================================
   AKTIONEN
   ===================================================================== */
function applyField(el){
  if(el.dataset.i !== undefined){
    state.days[+el.dataset.i][el.dataset.f] = el.value;
  } else if(el.dataset.s){
    var k = el.dataset.s, v = (el.type==='checkbox') ? el.checked : el.value;
    if(state[k] === v) return;
    if(k==='branch'){
      var prevLabel = branchLabel(state.branch);
      state.branch = v;
      if(!state.area.trim() || state.area === prevLabel){
        state.area = branchLabel(v); var ar=$('#area'); if(ar) ar.value = state.area;
      }
    } else {
      state[k] = v;
    }
    if(k==='weekend'){ save(); render(); return; }
  }
  save(); refresh();
}
function translateDay(i){
  var txt = state.days[i].note.trim().slice(0,1800);
  window.open('https://translate.google.com/?sl=auto&tl=de&op=translate&text='+encodeURIComponent(txt),'_blank','noopener');
}
function quickFill(i,k){
  var d = state.days[i], cur = d.text.trim();
  if(k==='school' && cur){
    if(cur.indexOf(QUICK.school) === -1){ d.text = cur+'\n'+QUICK.school; }
  } else {
    if(cur && !window.confirm(t('replaceConfirm'))) return;
    d.text = QUICK[k];
  }
  var ta = $('#text-'+i); if(ta) ta.value = d.text;
  save(); refresh();
}
function newWeek(){
  if(!window.confirm(t('newWeekConfirm'))) return;
  var info = weekInfo();
  state.days = [0,1,2,3,4,5,6].map(emptyDay);
  state.instr=''; state.instrHours=''; state.school=''; state.schoolHours='';
  if(info){
    var next = toISO(addDays(info.mon,7));
    state.date = (next <= SCHOOLYEAR.end) ? next : '';
  }
  save(); render(); window.scrollTo(0,0);
}


function saveTemplate(){
  state.tpl = {weekend:state.weekend, days:state.days.map(function(d){return {text:d.text,hours:d.hours};})};
  save(); toast(t('tplSaved'));
}
function loadTemplate(){
  var tp = state.tpl;
  if(!tp){ toast(t('tplNone')); return; }
  tp.days.forEach(function(td,i){
    var d = state.days[i];
    if(!d.text.trim() && td.text){ d.text = td.text; if(!String(d.hours).trim()) d.hours = td.hours; }
  });
  if(tp.weekend) state.weekend = true;
  save(); render(); toast(t('tplLoaded'));
}

/* Fachphrasen-Auswahl (Bottom-Sheet) */
var sheetDay = 0;
function openSheet(i){
  sheetDay = i;
  var dlg = $('#sheet');
  var body = '';
  if(!state.branch) body += '<p class="hint">'+esc(t('chooseBranch'))+'</p>';
  CATS.forEach(function(c,ci){
    var list = phraseList(ci);
    var tr = (state.lang!=='de' && CAT_T[state.lang]) ? '<span class="ct">'+esc(CAT_T[state.lang][ci])+'</span>' : '';
    body += '<details class="cat"'+(ci===0?' open':'')+'><summary><span lang="de" dir="ltr">'+esc(c)+'</span>'+tr+'</summary><div class="plist">'+
      list.map(function(p,pi){
        return '<div class="prow"><button type="button" class="phrase" lang="de" dir="ltr" data-ci="'+ci+'" data-pi="'+pi+'">'+esc(p)+'</button>'+
          (state.lang!=='de' ? '<button type="button" class="btn small trbtn" data-ptr="1" data-ci="'+ci+'" data-pi="'+pi+'" aria-label="'+esc(t('phraseTr'))+'" title="'+esc(t('phraseTr'))+'">🌐</button>' : '')+
          '</div>';
      }).join('')+'</div></details>';
  });
  dlg.innerHTML = '<div class="sheet-head"><h2 id="sheetTitle">'+esc(t('sheetTitle'))+' '+esc(dayName(i))+
    (state.branch?' – '+esc(branchLabel(state.branch)):'')+'</h2>'+
    '<button type="button" class="btn small" data-sheet="close">'+esc(t('close'))+'</button></div>'+
    '<div class="sheet-body"><p id="sheetMsg" role="status" class="small-note" style="min-height:1.3em;margin:.3rem 0 0"></p>'+body+'</div>';
  if(typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','');
}
function insertPhrase(i,text){
  var d = state.days[i], cur = d.text.replace(/\s+$/,'');
  d.text = cur ? cur+'\n– '+text : '– '+text;
  var ta = $('#text-'+i); if(ta) ta.value = d.text;
  save(); refresh();
}

/* =====================================================================
   PDF (Layout nach IHK-Vorlage "Ausbildungsnachweis wöchentlich")
   ===================================================================== */
function pdfSafe(s){
  return String(s||'').replace(/\r/g,'')
    .replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D\u201E]/g,'"')
    .replace(/\u2022/g,'-').replace(/\u2026/g,'...').replace(/\u20AC/g,'EUR')
    .replace(/[^\n\u0020-\u007E\u00A0-\u00FF]/g,'?');
}
function buildPDF(doc, st, info){
  var W=210, H=297, M=14, CW=W-2*M, TOP=12, BOT=H-10;
  var dayNames = DAYS_DE;
  doc.setLineWidth(0.3); doc.setDrawColor(0); doc.setTextColor(0);
  doc.setLineHeightFactor(1.2);

  // Titel
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Ausbildungsnachweis (Berichtsheft)', M, TOP+6);
  doc.setFontSize(11); doc.text('- wöchentlich -', M, TOP+12);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.text(STAND_TEXT, M, TOP+17);

  // Logo / Kopf rechts: nur Bremen
  if(st.land === 'HB'){
    var drawn = false;
    if(LOGO.data){ try{ doc.addImage(LOGO.data, LOGO.type, W-M-LOGO.w, TOP, LOGO.w, LOGO.h); drawn = true; }catch(e){ drawn = false; } }
    if(!drawn){
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Handelskammer Bremen', W-M, TOP+5, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.text('IHK für Bremen und Bremerhaven', W-M, TOP+9.5, {align:'right'});
    }
  }

  // Kopffelder
  var y = TOP+22, RH = 8;
  function cell(x,yy,w,label,val){
    doc.rect(x,yy,w,RH);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text(label, x+2, yy+5.2);
    var lw = doc.getTextWidth(label);
    doc.setFont('helvetica','normal');
    var fs = 10; doc.setFontSize(fs); var avail = w-lw-6;
    while(fs>6 && doc.getTextWidth(val)>avail){ fs-=0.5; doc.setFontSize(fs); }
    doc.text(val, x+lw+4, yy+5.4);
  }
  cell(M,y,CW,'Name des/der Auszubildenden:',pdfSafe(st.name.trim()));
  y += RH;
  cell(M,y,CW*0.40,'Ausbildungsjahr:',pdfSafe(String(st.year)));
  cell(M+CW*0.40,y,CW*0.60,'Ausbildungsbereich:',pdfSafe(st.area.trim()));
  y += RH;
  cell(M,y,CW*0.42,'Ausbildungswoche vom:',fmt(info.mon));
  cell(M+CW*0.42,y,CW*0.34,'bis:',fmt(info.sun));
  cell(M+CW*0.76,y,CW*0.24,'KW:',String(info.week));
  y += RH + 5;
  var tableY = y;

  // Spalten
  var labW=9, hrsW=22, xt=M+labW, xh=M+CW-hrsW;
  var textW = xh-xt-3.6, fullW = xh-M-3.6;
  var HDR = 7, SIG = 34, GAP = 8;

  function layout(fs){
    doc.setFont('helvetica','normal'); doc.setFontSize(fs);
    var lh = fs*0.3528*1.2;
    var dl = st.days.map(function(d){ var tx=d.text.trim(); return tx ? doc.splitTextToSize(pdfSafe(tx),textW) : []; });
    var il = st.instr.trim() ? doc.splitTextToSize(pdfSafe(st.instr.trim()),fullW) : [];
    var sl = st.school.trim() ? doc.splitTextToSize(pdfSafe(st.school.trim()),fullW) : [];
    var dh = dl.map(function(l){ return Math.max(17.5, l.length*lh+4); });
    var ih = Math.max(16, il.length*lh+4), sh = Math.max(22, sl.length*lh+4);
    var total = HDR + dh.reduce(function(a,b){return a+b;},0) + HDR + ih + HDR + sh + GAP + SIG;
    return {fs:fs,lh:lh,dl:dl,il:il,sl:sl,dh:dh,ih:ih,sh:sh,total:total};
  }
  var L = null;
  for(var fs=9; fs>=6.5; fs-=0.5){ L = layout(fs); if(L.total <= BOT-tableY) break; }

  function ensure(h){ if(y+h > BOT){ doc.addPage(); y = TOP; } }
  function header(title){
    doc.setFillColor(226,226,226);
    doc.rect(M,y,xh-M,HDR,'FD'); doc.rect(xh,y,hrsW,HDR,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text(title, M+2, y+4.9);
    doc.text('Stunden', xh+hrsW/2, y+4.9, {align:'center'});
    y += HDR;
  }
  function hoursText(h,rowH,rowY){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(pdfSafe(String(h||'').trim()), xh+hrsW/2, rowY+rowH/2+1.3, {align:'center'});
  }
  function textLines(lines,x,rowY){
    if(!lines.length) return;
    doc.setFont('helvetica','normal'); doc.setFontSize(L.fs);
    doc.text(lines, x, rowY+2.3+L.fs*0.3528*0.85);
  }

  // Betriebliche Tätigkeiten (Mo-So)
  ensure(HDR+17.5);
  header('Betriebliche Tätigkeiten');
  for(var i=0;i<7;i++){
    var h = L.dh[i]; ensure(h);
    doc.rect(M,y,labW,h); doc.rect(xt,y,xh-xt,h); doc.rect(xh,y,hrsW,h);
    doc.setFont('helvetica','bold');
    var lf = 7.5; doc.setFontSize(lf);
    while(lf>5 && doc.getTextWidth(dayNames[i])>h-3){ lf-=0.5; doc.setFontSize(lf); }
    var tw = doc.getTextWidth(dayNames[i]);
    doc.text(dayNames[i], M+labW/2+1.2, y+h/2+tw/2, {angle:90});
    textLines(L.dl[i], xt+1.8, y);
    hoursText(st.days[i].hours, h, y);
    y += h;
  }
  // Unterweisungen
  ensure(HDR+L.ih);
  header('Unterweisungen, betrieblicher Unterricht, sonstige Schulungen');
  doc.rect(M,y,xh-M,L.ih); doc.rect(xh,y,hrsW,L.ih);
  textLines(L.il, M+1.8, y); hoursText(st.instrHours, L.ih, y);
  y += L.ih;
  // Berufsschule
  ensure(HDR+L.sh);
  header('Themen des Berufsschulunterrichts');
  doc.rect(M,y,xh-M,L.sh); doc.rect(xh,y,hrsW,L.sh);
  textLines(L.sl, M+1.8, y); hoursText(st.schoolHours, L.sh, y);
  y += L.sh;

  // Unterschriften
  y += GAP; ensure(SIG-4);
  var colW = (CW-12)/2, x2 = M+colW+12;
  doc.setLineWidth(0.35);
  var r1 = y+10, r2 = y+27;
  doc.line(M,r1,M+colW,r1); doc.line(x2,r1,x2+colW,r1);
  doc.line(M,r2,M+colW,r2); doc.line(x2,r2,x2+colW,r2);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text('Datum, Unterschrift Auszubildende/r', M, r1+3.6);
  doc.text('Datum, Unterschrift Ausbildende/r oder Ausbilder/in', x2, r1+3.6);
  doc.text('Datum, Unterschrift gesetzliche/r Vertreter/in', M, r2+3.6);
  doc.text('ggf. weitere Sichtvermerke (z.B. Arbeitnehmervertreter)', x2, r2+3.6);
}
function makePDF(){
  var miss = missingList(), info = weekInfo();
  if(miss.length || !info || !(window.jspdf && window.jspdf.jsPDF)){
    toast(window.jspdf ? t('missing')+' '+miss.length : 'PDF-Bibliothek nicht geladen'); return;
  }
  var doc = new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  buildPDF(doc, state, info);
  var slug = state.name.trim().replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_').replace(/^_+|_+$/g,'');
  doc.save('Berichtsheft_KW'+pad(info.week)+'_'+info.year+(slug?'_'+slug:'')+'.pdf');
}

/* =====================================================================
   EREIGNISSE
   ===================================================================== */
var app = $('#app');
app.addEventListener('input', function(e){ if(e.target.id && e.target.id.indexOf('gl-')===0){ updateLink(); return; } applyField(e.target); });
app.addEventListener('change', function(e){ if(e.target.id && e.target.id.indexOf('gl-')===0){ updateLink(); return; } applyField(e.target); });
app.addEventListener('paste', function(e){
  var el = e.target;
  if(!(el && (el.id==='school' || el.id==='instr'))) return;
  var cd = e.clipboardData || window.clipboardData;
  var txt = cd ? cd.getData('text') : '';
  if(!txt) return;
  e.preventDefault();
  var clean = txt.replace(/\r/g,'').replace(/\t+/g,'  ').replace(/[ \u00A0]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  el.setRangeText(clean, el.selectionStart, el.selectionEnd, 'end');
  el.dispatchEvent(new Event('input',{bubbles:true}));
});
app.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act, i = +b.dataset.i;
  if(act==='lang'){ state.lang = b.dataset.v; save(); render(); }
  else if(act==='translate'){ translateDay(i); }
  else if(act==='copyprompt'){
    var note = state.days[i].note.trim();
    copyText(PROMPT.replace('[TEXT]', note || '[TEXT]')).then(function(){ toast(t('copied')); });
  }
  else if(act==='quick'){ quickFill(i,b.dataset.k); }
  else if(act==='phrases'){ openSheet(i); }
  else if(act==='newweek'){ newWeek(); }
  else if(act==='savetpl'){ saveTemplate(); }
  else if(act==='loadtpl'){ loadTemplate(); }
  else if(act==='copylink'){ copyText($('#gl-out').value).then(function(){ toast('Link kopiert'); }); }
  else if(act==='pdf'){ makePDF(); }
});
$('#sheet').addEventListener('click', function(e){
  var dlg = e.currentTarget;
  if(e.target === dlg || e.target.closest('[data-sheet="close"]')){ if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); return; }
  var tb = e.target.closest('[data-ptr]');
  if(tb){
    var ph = phraseList(+tb.dataset.ci)[+tb.dataset.pi];
    window.open('https://translate.google.com/?sl=de&tl='+state.lang+'&op=translate&text='+encodeURIComponent(ph),'_blank','noopener');
    return;
  }
  var p = e.target.closest('.phrase'); if(!p) return;
  var text = phraseList(+p.dataset.ci)[+p.dataset.pi];
  insertPhrase(sheetDay, text);
  p.classList.add('done');
  var msg = $('#sheetMsg'); if(msg) msg.textContent = '✓ '+t('inserted')+': '+dayName(sheetDay);
});

load();
applyParams();
render();

})();
</script>
